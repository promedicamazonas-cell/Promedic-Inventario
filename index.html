    v.insertAdjacentHTML("beforeend",
      '<div class="nota"><b>Por que aqui no dice cual comprar primero:</b> para saber que ' +
      'producto tiene mas salida hace falta medir consumo entre DOS conteos del mismo ' +
      'producto, y hoy solo 5 de los ' + cat.length + ' llevan dos. La otra via seria la ' +
      'pantalla <b>Vender</b> de esta misma app, que guarda cada salida — pero todavia no ' +
      'esta en uso. En cuanto haya una de las dos, esta pantalla puede ordenarse por ' +
      'rotacion de verdad y no por corazonada.</div>');
}

function vistaVencer(){
  const v = $("#vista"); v.innerHTML = "";
  if(!cat.length) return sinCatalogo(v);

  /* --- retiro de vencidos: barra de avance + uno por uno --- */
  const vencidos = cat.filter(p => conStock(p) && p.venc && diasPara(p.venc) < 0);
  const retirados = bajas.filter(b => !b.deshecha && b.motivo === "vencido");
  const valVenc = vencidos.reduce((s,p) => s + valor(p), 0);
  const valRet  = retirados.reduce((s,b) => s + (b.valor || 0), 0);
  const totalN  = vencidos.length + retirados.length;

  if(totalN){
    const pct = totalN ? Math.round(100 * retirados.length / totalN) : 0;
    v.insertAdjacentHTML("beforeend",
      '<div class="barra">' +
        '<div class="lin"><span>Retirados <b>' + retirados.length + '</b> de <b>' + totalN + '</b></span>' +
        '<span><b>' + soles(valRet) + '</b> fuera del inventario</span></div>' +
        '<div class="riel"><i style="width:' + pct + '%"></i></div>' +
      '</div>');
  }

  /* --- ya vencidos, pendientes de retirar --- */
  v.insertAdjacentHTML("beforeend",
    '<h2 class="sec">Ya vencidos · retirar del estante' +
    (vencidos.length ? " · " + vencidos.length + " · " + soles(valVenc) : "") + '</h2>');

  if(!vencidos.length){
    v.insertAdjacentHTML("beforeend",
      '<div class="vacio">' + (retirados.length
        ? "Todo lo vencido ya está retirado. " + soles(valRet) + " fuera del inventario."
        : "Nada vencido con stock. Bien.") + '</div>');
  } else {
    v.insertAdjacentHTML("beforeend",
      '<div class="nota">Marca cada uno <b>solo cuando ya lo tengas fuera del estante</b>. ' +
      'No borra el producto: le pone stock 0 y queda constancia de qué retiraste, ' +
      'cuándo y cuánto valía. Si te equivocas, puedes deshacerlo abajo.</div>');
    /* el más caro primero: si el día se corta a la mitad, que lo hecho sea lo que pesa */
    vencidos.sort((a,b) => valor(b) - valor(a)).forEach(pr => {
      const fila = filaProd(pr);
      const box = document.createElement("div");
      box.className = "ret";
      const bt = document.createElement("button");
      bt.textContent = "Ya lo retiré del estante";
      bt.onclick = () => {
        if(!confirm("¿Confirmas que YA sacaste del estante?\n\n" + pr.nom +
                    "\n\n" + (pr.stock || 0) + " unidades · " + soles(valor(pr)) +
                    "\n\nQueda en stock 0 y se anota en el acta de retiro."))
          return;
        retirar(pr, "vencido");
        vistaVencer();
      };
      box.appendChild(bt);
      fila.style.flexWrap = "wrap";
      fila.appendChild(box);
      box.style.flexBasis = "100%";
      v.appendChild(fila);
    });
  }

  /* --- lo ya retirado, con deshacer --- */
  if(retirados.length){
    v.insertAdjacentHTML("beforeend",
      '<h2 class="sec">Retirados · ' + retirados.length + ' · ' + soles(valRet) + '</h2>');
    retirados.slice().reverse().forEach(b => {
      const div = document.createElement("div");
      div.className = "prod hecho";
      div.style.setProperty("--c", "var(--verde)");
      div.style.flexWrap = "wrap";
      div.innerHTML =
        '<div class="txt"><b>✓ ' + b.nom + '</b><span>' + b.cat + ' · ' + b.q +
        ' und · retirado el ' + fmtFecha(b.f) + (b.h ? " a las " + b.h : "") + '</span></div>' +
        '<div class="der"><b>' + soles(b.valor || 0) + '</b><span>fuera</span></div>';
      const box = document.createElement("div");
      box.className = "ret"; box.style.flexBasis = "100%";
      const bt = document.createElement("button");
      bt.className = "des";
      bt.textContent = "Deshacer · devolver " + b.q + " al stock";
      bt.onclick = () => {
        if(!confirm("¿Devolver " + b.q + " unidades de\n\n" + b.nom +
                    "\n\nal stock? Se quita del acta de retiro.")) return;
        deshacerBaja(b);
        vistaVencer();
      };
      box.appendChild(bt);
      div.appendChild(box);
      v.appendChild(div);
    });
    const bc = document.createElement("button");
    bc.className = "btn"; bc.id = "btnCompActa";
    bc.textContent = "Compartir el acta de retiro";
    bc.onclick = compartirActa;
    v.appendChild(bc);
    const btn = document.createElement("button");
    btn.className = "btn sec";
    btn.textContent = "Descargar el acta de retiro (CSV)";
    btn.onclick = bajarActa;
    v.appendChild(btn);
    v.insertAdjacentHTML("beforeend",
      '<div class="nota">El acta es lo que hace <b>demostrable</b> la merma el día del ' +
      'traspaso: fecha, producto, unidades y valor. Guárdala en la carpeta del negocio.</div>');
  }

  /* --- los que todavía no vencen --- */
  const grupos = [
    {k:"d30",  t:"Vencen este mes", n:"Nada vence en 30 días."},
    {k:"d90",  t:"Vencen en 90 días · aún se puede devolver o promocionar", n:"Nada en 90 días."},
    {k:"d180", t:"Vencen en 6 meses · vigilar", n:"Nada en 6 meses."}
  ];
  grupos.forEach(g => {
    const l = cat.filter(p => {
      if(!conStock(p) || !p.venc) return false;
      const f = franja(diasPara(p.venc));
      return f && f.k === g.k;
    }).sort((a,b) => a.venc.localeCompare(b.venc));
    const val = l.reduce((s,p) => s + valor(p), 0);
    v.insertAdjacentHTML("beforeend",
      '<h2 class="sec">' + g.t + (l.length ? " · " + l.length + " · " + soles(val) : "") + '</h2>');
    if(!l.length) v.insertAdjacentHTML("beforeend", '<div class="vacio">' + g.n + '</div>');
    else l.forEach(p => v.appendChild(filaProd(p)));
  });

  const sinF = cat.filter(p => conStock(p) && !p.venc);
  if(sinF.length){
    v.insertAdjacentHTML("beforeend",
      '<h2 class="sec">Sin fecha de vencimiento · ' + sinF.length + '</h2>');
    v.insertAdjacentHTML("beforeend",
      '<div class="nota">Estos productos tienen stock pero no sabemos cuándo vencen. ' +
      'Míralos cuando toque contarlos y anota la fecha del envase — hasta entonces, ' +
      '<b>la app no puede avisarte de ellos</b>.</div>');
    sinF.forEach(p => v.appendChild(filaProd(p, "sin fecha")));
  }
}

/* ---------- VENTA RAPIDA (solo clase A) -------------------------------
   El metodo no registra ventas: se deducen contando. Pero un Minoderm de
   S/95 no es un sachet de S/0.25 — ahi una sola venta ya mueve la aguja,
   y entre conteo y conteo el numero se aleja demasiado.

   Por eso esto existe SOLO para clase A, donde esta el 80% del dinero, y
   es OPCIONAL: si no lo usas, el siguiente conteo lo corrige igual. No se
   extiende a B ni a C a proposito — ahi el volumen de ventas es alto, el
   valor bajo, y acabarias tecleando todo el dia. Eso mata el sistema.

   Lo vendido NO se usa para calcular el consumo aparente (que sigue
   saliendo de conteo a conteo); solo mantiene el stock mas cerca de la
   realidad. Asi no hay doble conteo.                                   */
function ventaRapida(p, cant){
  const antes = p.stock || 0;
  p.stock = Math.max(0, antes - cant);
  p.ventas = p.ventas || [];
  p.ventas.push({f: hoyISO(), q: cant});
  if(p.ventas.length > 60) p.ventas = p.ventas.slice(-60);
  grabar(); pintarEstado();
  return antes - p.stock;      /* lo realmente descontado */
}

function controlVenta(p, alHacer){
  const box = document.createElement("div");
  box.className = "vr";
  box.innerHTML = '<button class="uno">−1</button>' +
    '<input type="number" inputmode="numeric" min="1" placeholder="¿cuántos vendiste?">' +
    '<button class="ok">Descontar</button>';
  const inp = box.querySelector("input");
  /* −1 es el caso normal: se vende de a uno. Un boton se toca mas rapido
     que teclear un 1 y darle a Descontar, y con el mostrador lleno eso
     es la diferencia entre usarlo y no usarlo. */
  box.querySelector(".uno").onclick = () => {
    if((p.stock || 0) <= 0) return alert("Ese producto ya esta en 0.");
    const d = ventaRapida(p, 1);
    if(alHacer) alHacer(d);
  };
  box.querySelector(".ok").onclick = () => {
    const c = parseFloat(inp.value);
    if(isNaN(c) || c <= 0) return alert("Escribe cuántas unidades vendiste.");
    if(c > (p.stock || 0) &&
       !confirm("Dice que solo quedan " + (p.stock || 0) + ". ¿Descontar igual y dejarlo en 0?"))
      return;
    const d = ventaRapida(p, c);
    inp.value = "";
    if(alHacer) alHacer(d);
  };
  inp.onkeydown = e => { if(e.key === "Enter") box.querySelector(".ok").click(); };
  return box;
}

/* ---------- VENDER (solo clase A) ------------------------------------
   Existia desde la v0.6, pero escondido: habia que ir a Buscar y teclear
   dos letras para que apareciera. El lo dijo tal cual: "no veo la opcion
   de la clase A donde pueda descontar los vendidos". Una funcion que hay
   que encontrar es una funcion que no se usa. Ahora tiene su propia
   pantalla y sale sola, sin escribir nada.

   Sigue siendo SOLO clase A, y eso no cambia: ahi esta el 80% del dinero
   y una venta suelta ya mueve la aguja. En B y C el volumen es alto y el
   valor bajo — teclearlas acabaria matando el sistema entero.

   No aparece en la pantalla de Contar a proposito: si estas contando ese
   producto, descontar una venta sobra. El conteo fija el stock real y
   pisa cualquier ajuste.                                                */
function vistaVender(){
  const v = $("#vista");
  v.innerHTML = '<h2 class="sec">Descontar lo que vendiste</h2>' +
    '<div class="busca"><input type="text" id="qv" placeholder="Filtrar por nombre" ' +
    'autocomplete="off"><button id="limpiaV" title="Borrar">×</button></div>' +
    '<div id="resv"></div>';
  if(!cat.length){ return sinCatalogo($("#resv")); }

  const norm = t => t.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const pintar = () => {
    const q = norm(($("#qv").value || "").trim());
    const r = $("#resv"); r.innerHTML = "";
    let l = cat.filter(p => p.abc === "A" && conStock(p) && !p.fusion);
    if(q.length >= 2) l = l.filter(p => norm(p.nom).includes(q));
    /* Primero lo que ya vendiste alguna vez, lo mas reciente arriba; despues,
       por valor. Ordenar solo por valor sonaba bien pero no sirve en el
       mostrador: lo que necesitas encontrar rapido es lo que acabas de
       vender, no lo que mas plata tiene en el estante. Con el uso, la
       pantalla se te va acomodando sola. */
    const ultVenta = p => (p.ventas && p.ventas.length)
      ? p.ventas[p.ventas.length - 1].f : "";
    l.sort((a,b) => {
      const ua = ultVenta(a), ub = ultVenta(b);
      if(ua !== ub) return ub.localeCompare(ua);   /* mas reciente primero */
      return valor(b) - valor(a);
    });

    if(!cat.some(p => p.abc === "A")){
      r.innerHTML = '<div class="vacio">No hay productos de clase A en el catálogo.</div>';
      return;
    }
    if(!l.length){
      r.innerHTML = '<div class="vacio">' + (q.length >= 2
        ? 'Ningún producto de clase A con stock coincide con «' + $("#qv").value + '».'
        : 'No hay productos de clase A con stock.') + '</div>';
      return;
    }
    const tope = 40;
    r.insertAdjacentHTML("beforeend",
      '<div class="nota">Toca <b>−1</b> cuando vendas uno, o escribe la cantidad. ' +
      'Solo aparecen los de <b>clase A</b>: ahí está el 80% de tu dinero y una venta ' +
      'suelta ya mueve el número. Los de B y C se corrigen solos en el conteo.</div>');
    r.insertAdjacentHTML("beforeend",
      '<h2 class="sec">Clase A con stock · ' + l.length +
      (l.length > tope ? ' · se muestran los ' + tope + ' de mayor valor' : '') + '</h2>');
    l.slice(0, tope).forEach(p => {
      const fila = filaProd(p);
      r.appendChild(fila);
      const c = controlVenta(p, () => pintar());
      c.style.margin = "-4px 0 8px";
      r.appendChild(c);
    });
    if(l.length > tope)
      r.insertAdjacentHTML("beforeend",
        '<div class="nota">Hay <b>' + (l.length - tope) + '</b> más. Escribe parte del ' +
        'nombre arriba para encontrarlos.</div>');
  };

  $("#qv").oninput = () => { $("#limpiaV").style.display = $("#qv").value ? "block" : "none"; pintar(); };
  $("#limpiaV").onclick = () => {
    $("#qv").value = ""; $("#limpiaV").style.display = "none"; pintar(); $("#qv").focus();
  };
  pintar();
}

function vistaBuscar(){
  const v = $("#vista");
  v.innerHTML = '<h2 class="sec">Buscar producto</h2>' +
    '<div class="busca"><input type="text" id="q" placeholder="Escribe parte del nombre" ' +
    'autocomplete="off"><button id="limpiaQ" title="Borrar">×</button></div>' +
    '<div id="res"></div>';
  if(!cat.length){ $("#res").innerHTML = ""; return sinCatalogo($("#res")); }
  const norm = t => t.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const pintar = () => {
    const q = norm($("#q").value.trim());
    const r = $("#res"); r.innerHTML = "";
    if(q.length < 2){
      r.innerHTML = '<div class="vacio">Escribe al menos dos letras.<br>' +
        cat.length + ' productos en el catálogo.</div>';
      return;
    }
    /* v0.21: las filas juntadas TAMBIEN salen. Antes se filtraban con
       !p.fusion y el resultado era que una fila absorbida parecia borrada:
       no estaba en la cola, no estaba en Buscar, y el unico rastro era un
       boton en OTRA fila. Una fila puede quedar inactiva; invisible, no. */
    const l = cat.filter(p => norm(p.nom).includes(q)).slice(0, 60);
    if(!l.length){ r.innerHTML = '<div class="vacio">Sin resultados para «' + $("#q").value + '».</div>'; return; }
    r.insertAdjacentHTML("beforeend", '<h2 class="sec">' + l.length + ' resultado(s)</h2>');
    l.forEach(p => {
      const fila = filaProd(p);
      r.appendChild(fila);

      /* Una fila absorbida no se cuenta ni se vende: se explica y se ofrece
         deshacer. El texto dice DONDE fue a parar su stock, que es lo unico
         que el necesita saber para quedarse tranquilo. */
      if(p.fusion){
        fila.style.opacity = ".62";
        const q2 = cat.find(x => x.id === p.fusion);
        const bx = document.createElement("div");
        bx.className = "juntada";
        bx.innerHTML = '<b>Esta fila se juntó con otra.</b> Su stock no se perdió: pasó a ' +
          (q2 ? '«' + q2.nom + '»' + (q2.pres ? ' (' + q2.pres + ')' : '') +
                ', que ahora tiene <b>' + (q2.stock || 0) + '</b> unidades.'
              : 'la otra fila del mismo producto.');
        r.appendChild(bx);
        if(q2 && q2.desunir){
          const bd = document.createElement("button");
          bd.className = "des"; bd.style.margin = "0 0 10px";
          bd.textContent = "Separarlas otra vez";
          bd.onclick = () => {
            if(!confirm("Vas a separar otra vez las filas de:\n\n" + p.nom +
                        "\n\nCada una vuelve al stock que tenía. ¿Seguro?")) return;
            desunir(q2); pintar();
          };
          r.appendChild(bd);
        }
        return;   /* sin caja de contar ni de vender: esta fila no esta activa */
      }

      /* Contar o corregir, para CUALQUIER clase: el error de conteo no
         distingue de clases, y Buscar es el unico sitio que llega a un
         producto que ya salio de la cola. Va antes que la venta porque
         corregir un conteo recien hecho es lo urgente. */
      const cc = controlConteo(p, () => pintar());
      cc.style.margin = "-4px 0 8px";
      r.appendChild(cc);
      /* solo clase A: es donde una venta suelta cambia el numero de verdad */
      if(p.abc === "A"){
        const c = controlVenta(p, () => pintar());
        c.style.margin = "-4px 0 8px";
        r.appendChild(c);
      }
      /* Al juntar dos filas, la que sobrevive queda contada hoy y sale de la
         cola: el boton de deshacer NO se puede quedar solo en Contar, porque
         ahi ya no aparece. Buscar es el unico sitio que llega a cualquier
         producto, tenga o no conteo pendiente. */
      if(p.desunir){
        const bx = document.createElement("div");
        bx.className = "ret"; bx.style.margin = "-2px 0 8px";
        const bd = document.createElement("button");
        bd.className = "des";
        bd.textContent = "Deshacer la unión · separar otra vez";
        bd.onclick = () => {
          if(!confirm("Vas a separar otra vez las filas de:\n\n" + p.nom +
                      "\n\nCada una vuelve al stock que tenía. ¿Seguro?")) return;
          desunir(p); pintar();
        };
        bx.appendChild(bd);
        r.appendChild(bx);
      }

      /* Alta de lote: el caso real es "llego una caja con otra fecha". Va en
         Buscar porque es donde el llega a cualquier producto, y en la fila
         de conteo porque es donde esta cuando descubre la caja. */
      const bl = document.createElement("button");
      bl.className = "lapiz";
      bl.style.margin = "-2px 0 10px";
      bl.textContent = "➕ Otro lote de este producto";
      bl.onclick = () => {
        bl.style.display = "none";
        const ed = editorLote(p, hecho => { if(hecho) pintar();
                                            else { ed.remove(); bl.style.display = ""; } });
        ed.style.margin = "0 0 10px";
        bl.after(ed);
      };
      r.appendChild(bl);

      /* Buscar es el sitio donde se llega a CUALQUIER producto, tenga o no
         conteo pendiente. Por eso el lapiz tambien vive aqui. */
      const lap = document.createElement("button");
      lap.className = "lapiz";
      lap.style.margin = "-2px 0 10px";
      lap.textContent = p.marca ? "✎ Marca y vencimiento" : "✎ Falta la marca — ponerla";
      lap.onclick = () => {
        lap.style.display = "none";
        const ed = editorDatos(p, hecho => { if(hecho) pintar();
                                             else { ed.remove(); lap.style.display = ""; } });
        ed.style.margin = "0 0 10px";
        lap.after(ed);
      };
      r.appendChild(lap);
    });
  };
  $("#q").oninput = () => { $("#limpiaQ").style.display = $("#q").value ? "block" : "none"; pintar(); };
  $("#limpiaQ").onclick = () => {
    $("#q").value = "";
    $("#limpiaQ").style.display = "none";
    pintar();
    $("#q").focus();
  };
  pintar();
}


/* ---------- PARTE 2: CONTEO CICLICO ----------------------------------
   El problema real no era falta de disciplina: contar 700 productos de
   una vez es imposible mientras atiendes. Aqui se cuentan ~17 al dia,
   elegidos por cuanto dinero representan y por cuanto hace que no se
   miran. En unas semanas el catalogo entero queda tocado, sin que
   ningun dia te cueste mas de diez minutos.                          */
const META_DIARIA = 17;
const CADA = {A:30, B:90, C:180};   /* dias entre conteos, por clase */

const hoyISO = () => new Date().toISOString().slice(0,10);

/* ---------- FECHAS ---------------------------------------------------
   Dentro se guardan como AAAA-MM-DD (asi se ordenan solas y no hay
   ambiguedad). A la vista, siempre dd/mm/aaaa. El <input type="date">
   del sistema se descarto a proposito: muestra el formato del IDIOMA
   DEL TELEFONO — a Angel le salia mm/dd/yyyy — y eso no se puede
   cambiar desde la pagina.                                           */
function fmtFecha(iso){
  if(!iso) return "";
  const p = String(iso).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
}
/* Pone las barras solo mientras el teclea. El teclado numerico del
   telefono no trae "/" a la vista, asi que escribir la fecha obligaba a
   cambiar de teclado tres veces por producto. Tecleando 30062028 sale
   30/06/2028.

   Dos cuidados que parecen detalle y no lo son:
   - NO se agrega la barra final ("30/"). Si se agregara, el borrar se
     traba: borras la barra y la mascara la vuelve a poner.
   - El cursor solo se manda al final si ya estaba al final. Si el esta
     corrigiendo el mes en medio del texto, se queda donde estaba.        */
function mascaraFecha(inp){
  inp.maxLength = 10;
  inp.oninput = () => {
    const alFinal = inp.selectionStart === inp.value.length;
    const d = inp.value.replace(/\D/g, "").slice(0, 8);
    let t = d.slice(0, 2);
    if(d.length > 2) t += "/" + d.slice(2, 4);
    if(d.length > 4) t += "/" + d.slice(4, 8);
    if(t !== inp.value){
      inp.value = t;
      if(alFinal) inp.setSelectionRange(t.length, t.length);
    }
    inp.style.borderColor = "";
    /* Solo avisa: en rojo si esa fecha no existe (31/02, por ejemplo).
       NO se mueve el foco solo al completar las 8 cifras, aunque ahorraria
       un toque: si el se equivoca en el ano y le da a borrar, el borrado se
       lo come el campo de al lado y termina corrigiendo la cantidad sin
       darse cuenta. En el campo del que dependen todas las alertas de
       vencimiento, eso no se arriesga por un toque. */
    if(d.length === 8 && !parseFecha(t)) inp.style.borderColor = "var(--rojo)";
  };
}

/* dd/mm/aaaa -> AAAA-MM-DD. null si no vale. Comprueba que la fecha
   EXISTA de verdad: 31/02 se rechaza, no se convierte en 03/03.

   El ano va de 2 o 4 cifras, NUNCA de 3. Aceptaba 3 y "30/06/202" pasaba
   como el ano 202: guardaba venc="202-06-30" y a partir de ahi el producto
   quedaba vencido hace 1800 anos, sin que nada avisara. Aparecio al probar
   la mascara, tecleando y borrando una cifra. */
function parseFecha(t){
  const m = String(t).trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2}|\d{4})$/);
  if(!m) return null;
  let d = +m[1], mes = +m[2], a = +m[3];
  if(a < 100) a += 2000;
  if(a < 1900 || a > 2200) return null;
  if(mes < 1 || mes > 12 || d < 1 || d > 31) return null;
  const f = new Date(a, mes - 1, d);
  if(f.getFullYear() !== a || f.getMonth() !== mes - 1 || f.getDate() !== d) return null;
  const dos = x => String(x).padStart(2, "0");
  return a + "-" + dos(mes) + "-" + dos(d);
}

/* dias desde el ultimo conteo. null = nunca se conto */
function desdeConteo(p){
  if(!p.visto) return null;
  const h = new Date(); h.setHours(0,0,0,0);
  const q = p.visto.split("-");
  return Math.round((h - new Date(+q[0], +q[1]-1, +q[2])) / 86400000);
}
/* toca contarlo? nunca contado = si, siempre */
function toca(p){
  if(p.fusion) return false;          /* fila absorbida por otra: ya no existe */
  const d = desdeConteo(p);
  return d === null || d >= (CADA[p.abc] || 180);
}

/* La cola del dia.
   ORDEN: 1) la clase manda — A antes que B antes que C.
          2) dentro de la clase, lo nunca contado primero.
          3) despues lo mas atrasado.
          4) a igualdad, lo que mas dinero vale.

   El punto 1 no es un detalle. La primera version ordenaba solo por dias
   de atraso, y como la clase C se cuenta cada 180 dias, sus productos
   acumulaban mas atraso absoluto y se COLABAN delante de la clase A.
   Resultado: la cola se llenaba de productos que juntos valen S/1,189
   mientras los de S/18,868 esperaban. Justo al reves de para lo que
   existe el ABC. Lo cazo una prueba, no la lectura del codigo.

   En regimen normal todo cabe igual: A necesita ~13 conteos al dia,
   B ~2 y C ~1.3. Total ~17. Nadie se queda fuera; solo se ordena.   */
/* ---- LOTES DEL MISMO PRODUCTO ---------------------------------------
   El catalogo trae una fila por LOTE, no por producto: el mismo articulo
   con dos vencimientos son dos filas con el mismo nombre e Ids que se
   diferencian por un sufijo (-2, -3). En pantalla se veian identicas y el
   lo dijo asi: "hay productos que tienen 2 fechas y la app no me dice por
   cual lote me esta preguntando". Contaba a ciegas.

   54 productos del catalogo tienen mas de un lote.                      */
/* "X 7 OVULOS" y "X7 OVULOS" son el mismo producto. Sin separar la letra
   del numero, CLINDESS aparecia dos veces y la app pedia contar la misma
   caja dos veces sin avisar de nada. */
const nomClave = s => String(s || "").normalize("NFKD")
  .replace(/[\u0300-\u036f]/g, "").toUpperCase()
  .replace(/[^A-Z0-9]+/g, " ")
  .replace(/([A-Z])(?=[0-9])/g, "$1 ")
  .replace(/([0-9])(?=[A-Z])/g, "$1 ")
  .replace(/\s+/g, " ").trim();

function lotesDe(p){
  const k = nomClave(p.nom);
  /* orden FEFO: primero el que vence antes, que es el que hay que sacar
     primero del estante. Sin fecha va al final. */
  return cat.filter(x => nomClave(x.nom) === k && !x.fusion)
            .sort((a,b) => (a.venc || "9999").localeCompare(b.venc || "9999"));
}

/* Dos filas del mismo producto con la misma fecha PUEDEN ser una fila
   duplicada... o dos lotes de verdad.

   Ojo con esto, que no es un detalle: las fechas del catalogo son de
   MES Y ANIO (el dia siempre es 01). Dos lotes distintos comprados en
   momentos distintos comparten mes de vencimiento sin ningun problema.
   Asi que la fecha igual es una SOSPECHA, no una prueba.

   Lo unico que lo decide es el NUMERO DE LOTE del envase. Por eso:
   si las dos filas tienen lote escrito y son distintos, son dos lotes
   de verdad y la app se calla. */
function gemelos(p){
  if(!p.venc) return [];
  return lotesDe(p).filter(x => {
    if(x.id === p.id || x.venc !== p.venc) return false;
    if(p.lote && x.lote && p.lote.trim().toUpperCase() !== x.lote.trim().toUpperCase())
      return false;                       /* lotes distintos: no son la misma caja */
    return true;
  });
}

/* Junta las filas en una sola. No borra: la absorbida queda en 0 y marcada,
   para que el historial no se pierda y se pueda ver que paso. */
function fusionar(p, otros){
  const todos = [p].concat(otros);
  /* sobrevive la que se conto mas recientemente; si ninguna, la de mas stock */
  todos.sort((a,b) => (b.visto || "").localeCompare(a.visto || "") ||
                      (b.stock || 0) - (a.stock || 0));
  const q = todos[0];
  const absorbidos = todos.slice(1);
  /* Todo lo necesario para volver atras. La app SUGIERE que son la misma
     caja, y una sugerencia que no se puede deshacer no es una sugerencia:
     es una decision tomada por el. */
  q.desunir = {mio: q.stock || 0, visto: q.visto || "",
               otros: absorbidos.map(x => ({id: x.id, stock: x.stock || 0,
                                            aviso: x.aviso || ""}))};
  q.stock = todos.reduce((s,x) => s + (x.stock || 0), 0);
  absorbidos.forEach(x => {
    x.fusion = q.id;
    x.stock = 0;
    x.aviso = ("fila juntada con " + q.id).slice(0, 80);
  });
  q.visto = hoyISO();
  q.hist = (q.hist || []).concat([{f: hoyISO(), esp: q.stock, con: q.stock, fusion: true}]);
  grabar(); pintarEstado();
  return q;
}

function desunir(q){
  const d = q.desunir;
  if(!d) return;
  (d.otros || []).forEach(o => {
    const x = cat.find(y => y.id === o.id);
    if(!x) return;
    x.stock = o.stock; x.aviso = o.aviso; delete x.fusion;
  });
  q.stock = d.mio;
  q.visto = d.visto;
  if(q.hist && q.hist.length && q.hist[q.hist.length - 1].fusion) q.hist.pop();
  delete q.desunir;
  grabar(); pintarEstado();
}

const RANGO = {A:0, B:1, C:2};
function colaHoy(){
  const pend = cat.filter(toca);
  pend.sort((a,b) => {
    const ra = RANGO[a.abc] !== undefined ? RANGO[a.abc] : 3;
    const rb = RANGO[b.abc] !== undefined ? RANGO[b.abc] : 3;
    if(ra !== rb) return ra - rb;
    const da = desdeConteo(a), db = desdeConteo(b);
    if((da === null) !== (db === null)) return da === null ? -1 : 1;
    if(da !== null && da !== db) return db - da;
    return valor(b) - valor(a);
  });
  const elegidos = pend.slice(0, META_DIARIA);

  /* Si un producto tiene varios lotes, se cuentan TODOS de una. Estan en
     el mismo sitio del estante y ya tienes la caja en la mano; dejar el
     segundo lote para dentro de un mes es garantizar que los numeros no
     cuadren. Los lotes arrastrados no cuentan contra la meta del dia. */
  const salida = [], vistos = new Set();
  elegidos.forEach(p => {
    lotesDe(p).forEach(h => {
      if(vistos.has(h.id)) return;
      vistos.add(h.id);
      salida.push(h);
    });
  });
  return salida;
}

function vistaContar(){
  const v = $("#vista"); v.innerHTML = "";
  if(!cat.length) return sinCatalogo(v);

  const hechos = cat.filter(p => p.visto === hoyISO());
  const cola = colaHoy();
  const atrasados = cat.filter(toca).length;

  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Conteo de hoy</h2>');
  const pct = Math.min(100, Math.round(100 * hechos.length / META_DIARIA));
  v.insertAdjacentHTML("beforeend",
    '<div class="kpi"><small>Llevas contados hoy</small><b>' + hechos.length + ' de ' +
    META_DIARIA + '</b><div class="barra"><i style="width:' + pct + '%"></i></div>' +
    '<span style="font-size:11px;color:var(--suave)">' +
    (atrasados ? atrasados + ' productos esperan turno' : 'Todo el catálogo al día') +
    '</span></div>');

  if(!cola.length){
    v.insertAdjacentHTML("beforeend",
      '<div class="nota" style="margin-top:14px"><b>No toca contar nada más.</b><br>' +
      'Todo el catálogo está dentro de su plazo: clase A cada 30 días, B cada 90, C cada 180. ' +
      'Vuelve mañana.</div>');
    return mostrarDiferencias(v);
  }

  const extra = cola.length - Math.min(META_DIARIA, cat.filter(toca).length);
  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Cuenta estos ' + cola.length + '</h2>');
  if(extra > 0)
    v.insertAdjacentHTML("beforeend",
      '<div class="nota" style="margin:0 0 10px"><b>' + extra + ' de estos son lotes ' +
      'extra</b> del mismo producto. Están en el mismo sitio del estante: cuenta los dos ' +
      'de una, y no cuentan contra la meta del día.</div>');
  cola.forEach(p => v.appendChild(filaConteo(p)));
  mostrarDiferencias(v);
}

/* ---- EDITAR MARCA Y VENCIMIENTO -------------------------------------
   Se lo pidio asi: poner la marca cuando falta, y poder corregir la fecha
   cuando esta mal. Las dos cosas se hacen en el mismo sitio y con la caja
   en la mano, que es cuando se sabe la respuesta.

   La fecha se puede CORREGIR, no solo rellenar. Hasta la v0.14 solo se
   podia escribir si estaba vacia: una fecha mal cargada se quedaba mal
   para siempre y arrastraba todas las alertas de vencimiento.

   Cambiar una fecha que ya existia pide confirmacion. Rellenar una vacia
   no: ahi no se pisa nada.                                              */
const marcasUsadas = () => {
  const m = {};
  cat.forEach(p => { if(p.marca) m[p.marca] = 1; });
  return Object.keys(m).sort();
};

function editorDatos(p, alGuardar){
  const box = document.createElement("div");
  box.className = "edit";
  const lista = "mk" + Math.abs(String(p.id).split("").reduce((a,c) => a + c.charCodeAt(0), 0));
  box.innerHTML =
    '<label>Marca / laboratorio</label>' +
    '<input type="text" class="mkin" list="' + lista + '" placeholder="ISDIN, La Roche-Posay, Genfar…" ' +
      'autocomplete="off" value="' + (p.marca || "").replace(/"/g, "&quot;") + '">' +
    '<datalist id="' + lista + '">' +
      marcasUsadas().map(m => '<option value="' + m.replace(/"/g, "&quot;") + '">').join("") +
    '</datalist>' +
    '<label>Vence (dd/mm/aaaa)</label>' +
    '<input type="text" class="vcin" inputmode="numeric" placeholder="dd/mm/aaaa" ' +
      'autocomplete="off" value="' + (p.venc ? fmtFecha(p.venc) : "") + '">' +
    '<label>Presentación / contenido del envase</label>' +
    '<input type="text" class="prin" placeholder="120 mL, 30 g, 60 tabletas…" ' +
      'autocomplete="off" value="' + (p.pres || "").replace(/"/g, "&quot;") + '">' +
    '<label>N° de lote del envase</label>' +
    '<input type="text" class="ltin" placeholder="el que dice la caja" ' +
      'autocomplete="off" autocapitalize="characters" value="' +
      (p.lote || "").replace(/"/g, "&quot;") + '">' +
    '<div class="fin"><button class="no">Cancelar</button><button class="ok">Guardar</button></div>';
  const mk = box.querySelector(".mkin"), vc = box.querySelector(".vcin");
  mascaraFecha(vc);
  box.querySelector(".no").onclick = () => { if(alGuardar) alGuardar(false); };
  box.querySelector(".ok").onclick = () => {
    const nuevaMarca = mk.value.trim();
    const txt = vc.value.trim();
    let venc = p.venc || "";
    if(txt){
      const iso = parseFecha(txt);
      if(!iso) return alert("La fecha no es válida.\n\nEscríbela como dd/mm/aaaa, " +
                            "por ejemplo 30/06/2028.");
      if(p.venc && iso !== p.venc &&
         !confirm("Vas a cambiar el vencimiento de:\n\n" + p.nom +
                  "\n\nde " + fmtFecha(p.venc) + " a " + fmtFecha(iso) +
                  "\n\nDe esta fecha dependen las alertas. ¿Seguro?"))
        return;
      venc = iso;
    } else if(p.venc && !confirm("Vas a dejar sin fecha de vencimiento a:\n\n" + p.nom +
                                 "\n\nLa app no podrá avisarte de él. ¿Seguro?")){
      return;
    } else {
      venc = "";
    }
    p.marca = nuevaMarca;
    p.venc = venc;
    p.lote = box.querySelector(".ltin").value.trim();
    p.pres = box.querySelector(".prin").value.trim();
    grabar(); pintarEstado();
    if(alGuardar) alGuardar(true);
  };
  return box;
}

function filaConteo(p){
  const d = desdeConteo(p);
  const div = document.createElement("div");
  div.className = "cnt";
  div.style.setProperty("--c", p.abc === "A" ? "var(--rojo)"
                             : p.abc === "B" ? "var(--ambar)" : "var(--suave)");
  const cuando = d === null ? "nunca contado" : "hace " + d + " días";
  const pideFecha = !p.venc;     /* el momento de anotarla es con la caja en la mano */

  /* De que lote estamos hablando. Sin esto, dos filas identicas. */
  const lotes = lotesDe(p);
  const cual  = lotes.findIndex(x => x.id === p.id) + 1;
  const otros = lotes.filter(x => x.id !== p.id);
  const gem = gemelos(p);
  const loteTxt = p.lote ? ' · lote ' + p.lote : '';
  const cabLote = lotes.length > 1
    ? '<div class="lote' + (gem.length ? ' igual' : '') + '"><b>LOTE ' + cual + ' de ' +
      lotes.length + '</b>' +
      (p.venc ? '<span>vence ' + fmtFecha(p.venc) + loteTxt + '</span>'
              : '<span>sin fecha' + loteTxt + '</span>') + '</div>' +
      (gem.length ? '<div class="mismacaja">⚠ <b>Los dos vencen el mismo mes.</b> ' +
        'Puede ser una fila duplicada… o dos lotes de verdad. <b>Mira el número de lote ' +
        'del envase:</b> si es el mismo, júntalas; si son distintos, anótalos con el ✎ y ' +
        'no vuelvo a preguntarte.</div>' : '')
    : '';
  const otrosTxt = otros.length
    ? '<div class="otros">' + (otros.length === 1 ? "El otro lote" : "Los otros lotes") + ': ' +
      otros.map(x => (x.venc ? "vence " + fmtFecha(x.venc) : "sin fecha") +
                     (x.lote ? " · lote " + x.lote : "") +
                     " · " + (x.stock || 0) + " und").join(" — ") + '</div>'
    : '';

  div.innerHTML = cabLote +
    '<div class="cab"><b><span class="pastilla abc' + p.abc + '">' + p.abc + '</span>' +
      p.nom + (p.pres ? '<span class="pres">' + p.pres + '</span>' : '') + '</b>' +
    '<div class="esp">' + (p.visto ? "al " + fmtFecha(p.visto) : "sin contar") +
      '<br><b style="font-size:15px">' + (p.stock || 0) + '</b></div></div>' +
    '<div class="sub">' + (p.marca ? '<b class="mk">' + p.marca + '</b> · ' : '') +
      p.cat + ' · ' + cuando + ' · ' + soles(valor(p)) +
      (p.venc && lotes.length === 1 ? ' · vence ' + fmtFecha(p.venc) : '') + '</div>' +
    otrosTxt +
    (pideFecha ? '<div class="fecha"><small>⚠ Sin fecha de vencimiento — anótala del envase</small>' +
      '<input type="text" class="fv" inputmode="numeric" placeholder="dd/mm/aaaa" ' +
      'autocomplete="off"></div>' : '') +
    '<div class="fila">' +
      '<input type="number" inputmode="numeric" class="qty" placeholder="¿cuántos?">' +
      '<button class="sec ig">Igual</button>' +
      '<button class="gu">Guardar</button>' +
    '</div>';

  if(gem.length){
    const bx = document.createElement("div");
    bx.className = "ret";
    const bt = document.createElement("button");
    const tot = [p].concat(gem).reduce((s,x) => s + (x.stock || 0), 0);
    bt.textContent = "Es la misma caja · juntar en una sola";
    bt.onclick = () => {
      const todos = [p].concat(gem).slice()
        .sort((a,b) => (b.visto || "").localeCompare(a.visto || "") ||
                       (b.stock || 0) - (a.stock || 0));
      const q = todos[0];
      if(!confirm("Se van a juntar " + todos.length + " filas de:\n\n" + p.nom +
                  "\n\nQueda UNA con " + tot + " unidades y costo S/ " +
                  num(q.costo || 0) + ".\n\nLas otras quedan en 0 y marcadas, " +
                  "no se borran: las sigues viendo en BUSCAR y desde ahi puedes " +
                  "separarlas otra vez.\n\n¿Seguro?"))
        return;
      fusionar(p, gem);
      vistaContar();
    };
    bx.appendChild(bt);
    div.appendChild(bx);
  }

  /* el lapiz solo aparece si la fila NO esta pidiendo ya la fecha: si falta,
     el campo de arriba hace ese trabajo y dos campos de fecha confunden. */
  if(p.desunir){
    const bx = document.createElement("div");
    bx.className = "ret";
    const bt = document.createElement("button");
    bt.className = "des";
    bt.textContent = "Deshacer la unión · separar otra vez";
    bt.onclick = () => {
      if(!confirm("Vas a separar otra vez las filas de:\n\n" + p.nom +
                  "\n\nCada una vuelve al stock que tenía. ¿Seguro?")) return;
      desunir(p);
      vistaContar();
    };
    bx.appendChild(bt);
    div.appendChild(bx);
  }

  if(!pideFecha){
    const lap = document.createElement("button");
    lap.className = "lapiz";
    lap.textContent = p.marca ? "✎ Marca y vencimiento" : "✎ Falta la marca — ponerla";
    lap.onclick = () => {
      if(div.querySelector(".edit")) return;
      lap.style.display = "none";
      div.appendChild(editorDatos(p, hecho => {
        if(hecho) vistaContar();
        else { div.querySelector(".edit").remove(); lap.style.display = ""; }
      }));
    };
    div.appendChild(lap);
  }

  const qty = div.querySelector(".qty");
  const fvi = div.querySelector(".fv");
  if(fvi) mascaraFecha(fvi);
  const guardar = () => {
    const val = parseFloat(qty.value);
    if(isNaN(val) || val < 0) return alert("Escribe cuántas unidades hay. Si no hay, escribe 0.");
    const fv = div.querySelector(".fv");
    let venc = null;
    if(fv && fv.value.trim()){
      venc = parseFecha(fv.value);
      if(!venc) return alert("La fecha no es válida.\n\nEscríbela como dd/mm/aaaa, " +
                             "por ejemplo 30/06/2028.");
    }
    registrarConteo(p, val, venc);
    div.classList.add("ok");
    div.querySelectorAll("input,button").forEach(x => x.disabled = true);
    const dif = val - (p.stockPrev !== undefined ? p.stockPrev : val);
    setTimeout(() => vistaContar(), 450);
  };
  /* Con la caja en la mano es cuando descubre que hay otro lote. */
  const bl = document.createElement("button");
  bl.className = "lapiz";
  bl.style.margin = "8px 0 0";
  bl.textContent = "➕ Hay otro lote de este producto";
  bl.onclick = () => {
    bl.style.display = "none";
    const ed = editorLote(p, hecho => { if(hecho) vistaContar();
                                        else { ed.remove(); bl.style.display = ""; } });
    bl.after(ed);
  };
  div.appendChild(bl);

  div.querySelector(".gu").onclick = guardar;
  div.querySelector(".ig").onclick = () => { qty.value = p.stock || 0; guardar(); };
  qty.onkeydown = e => { if(e.key === "Enter") guardar(); };
  return div;
}

/* Guarda el conteo. La diferencia contra lo que decia el sistema NO se
   descarta: es la medida de tus mermas, y ese numero hoy no lo tienes.  */
function registrarConteo(p, contado, fechaVenc){
  const esperado = p.stock || 0;
  p.hist = p.hist || [];
  p.hist.push({f: hoyISO(), esp: esperado, con: contado});
  if(p.hist.length > 24) p.hist = p.hist.slice(-24);   /* no crecer sin limite */
  p.stockPrev = esperado;
  p.stock = contado;
  p.visto = hoyISO();
  if(fechaVenc) p.venc = fechaVenc;
  grabar();
  pintarEstado();
}

/* ---- DAR DE ALTA OTRO LOTE (v0.22) ----------------------------------
   El catalogo lleva UNA FILA POR LOTE. Hasta la v0.21 esas filas solo
   podian nacer en la laptop: editar el CSV, cifrarlo, subirlo a GitHub y
   volver a descargarlo. Cuando llega una caja nueva un martes cualquiera,
   eso no pasa — y la mercaderia se queda fuera del inventario.

   Tres decisiones:

   1. El lote nuevo hereda TODO del producto (nombre, categoria, costo,
      marca, presentacion, clase) y solo se le pregunta lo que de verdad
      cambia entre lotes: **vencimiento, numero de lote y cuantos hay**.
      Menos campos, menos abandono.
   2. Nace **contado hoy**, con una linea de historial marcada `alta` y con
      esperado = contado. Asi NO aparece como "sobrante" del dia: no es una
      diferencia de conteo, es mercaderia que entro. La medida de merma
      no se ensucia.
   3. El Id es el del producto con sufijo -2, -3… igual que los que ya
      genera el catalogo, y se comprueba que no exista.                    */
function idLoteNuevo(p){
  const base = String(p.id).replace(/-\d+$/, "");
  let n = 2, id = base + "-" + n;
  while(cat.some(x => x.id === id)){ n++; id = base + "-" + n; }
  return id;
}

function altaLote(p, venc, lote, cantidad){
  const q = {
    id: idLoteNuevo(p), nom: p.nom, cat: p.cat, costo: p.costo || 0,
    stock: cantidad, venc: venc, lote: lote, abc: p.abc || "C",
    marca: p.marca || "", pres: p.pres || "", aviso: "",
    visto: hoyISO(),
    hist: [{f: hoyISO(), esp: cantidad, con: cantidad, alta: true}]
  };
  cat.push(q);
  grabar(); pintarEstado();
  return q;
}

/* El formulario. Vive donde el esta cuando descubre la caja: en la fila de
   conteo y en Buscar. */
function editorLote(p, alTerminar){
  const box = document.createElement("div");
  box.className = "edit";
  box.innerHTML =
    '<div class="tit">Otro lote de <b>' + p.nom + '</b></div>' +
    '<label>Vence (dd/mm/aaaa)</label>' +
    '<input type="text" class="vcin" inputmode="numeric" placeholder="dd/mm/aaaa" autocomplete="off">' +
    '<label>N° de lote del envase</label>' +
    '<input type="text" class="ltin" placeholder="el que dice la caja" ' +
      'autocomplete="off" autocapitalize="characters">' +
    '<label>¿Cuántas unidades hay en ESTE lote?</label>' +
    '<input type="number" class="qtin" inputmode="numeric" min="0" placeholder="cantidad">' +
    '<div class="fin"><button class="no">Cancelar</button><button class="ok">Agregar el lote</button></div>';
  const vc = box.querySelector(".vcin");
  mascaraFecha(vc);
  box.querySelector(".no").onclick = () => { if(alTerminar) alTerminar(false); };
  box.querySelector(".ok").onclick = () => {
    const txt = vc.value.trim();
    const venc = txt ? parseFecha(txt) : "";
    if(txt && !venc)
      return alert("La fecha no es válida.\n\nEscríbela como dd/mm/aaaa, por ejemplo 30/07/2028.");
    const c = parseFloat(box.querySelector(".qtin").value);
    if(isNaN(c) || c < 0) return alert("Escribe cuántas unidades hay en este lote.");
    const lote = box.querySelector(".ltin").value.trim();
    /* Si ya hay un lote con esa misma fecha, avisar ANTES: casi siempre
       significa que es la misma caja y lo que toca es corregir el conteo
       del lote que ya existe, no crear otra fila. */
    const igual = lotesDe(p).filter(x => venc && x.venc === venc);
    if(igual.length &&
       !confirm("Ya tienes un lote de este producto que vence el mismo mes (" +
                fmtFecha(venc) + ").\n\nSi es la MISMA caja, cancela y corrige el conteo " +
                "de esa fila.\n\n¿Aun así quieres crear otro lote?"))
      return;
    const q = altaLote(p, venc, lote, c);
    alert("Lote agregado: " + c + " unidades de\n\n" + p.nom +
          (venc ? "\n\nvence " + fmtFecha(venc) : "") + (lote ? "\nlote " + lote : "") +
          "\n\nQueda contado hoy, así que no te lo va a volver a pedir.");
    if(alTerminar) alTerminar(true, q);
  };
  return box;
}

/* ---- CORREGIR UN CONTEO (v0.20) --------------------------------------
   Conto un producto, guardo, y despues encontro mas unidades. Hasta la
   v0.19 no habia vuelta atras: el producto salia de la cola y no volvia
   hasta que le tocara por su clase — 30 dias en la A.

   La distincion que hace este codigo, y que importa mas de lo que parece:

   - Si el conteo es de HOY, esto es una CORRECCION, no un conteo nuevo.
     Se reescribe la ultima linea del historial y **se respeta su `esp`**,
     que es lo que decia el sistema ANTES de contar. Si se guardara como
     un segundo conteo, la diferencia contra el primero entraria como si
     fuera merma del dia, y la merma es justo el numero que estamos
     esperando: ensuciarlo con una correccion de dedo seria peor que no
     tenerlo.
   - Si el ultimo conteo es de otro dia, entonces si es un conteo nuevo y
     va por el camino normal.

   Queda `corr` en la linea del historial: cuantas veces se corrigio. No
   se borra nada — el historial es la memoria del inventario.            */
function corregirConteo(p, contado){
  const u = (p.hist || []).length ? p.hist[p.hist.length - 1] : null;
  if(u && u.f === hoyISO()){
    u.con = contado;
    u.corr = (u.corr || 0) + 1;
    p.stock = contado;
    p.visto = hoyISO();
    grabar(); pintarEstado();
    return "corregido";
  }
  registrarConteo(p, contado);
  return "contado";
}

/* La caja de contar/corregir. Vive en Buscar —el unico sitio que llega a
   CUALQUIER producto, tenga o no conteo pendiente— y debajo de cada
   producto de "Contados hoy", que es donde el mira justo despues de
   guardar y donde se da cuenta del error.                               */
function controlConteo(p, alHacer){
  const hoy = p.visto === hoyISO();
  const box = document.createElement("div");
  box.className = "vr cta";
  box.innerHTML = '<input type="number" inputmode="numeric" min="0" ' +
    'placeholder="' + (hoy ? "contaste " + (p.stock || 0) + " — ¿cuántos hay?"
                           : "¿cuántos hay?") + '">' +
    '<button class="ok">' + (hoy ? "Corregir" : "Contar") + '</button>';
  const inp = box.querySelector("input");
  box.querySelector(".ok").onclick = () => {
    const c = parseFloat(inp.value);
    if(isNaN(c) || c < 0) return alert("Escribe cuántas unidades hay.");
    /* Confirmar SOLO al corregir: contar por primera vez no necesita
       friccion, pero pisar un conteo del dia si — y el aviso dice las dos
       cifras para que vea lo que esta cambiando. */
    if(hoy && !confirm("Hoy contaste " + (p.stock || 0) + " de:\n\n" + p.nom +
                       "\n\nVas a dejarlo en " + c + ". ¿Seguro?")) return;
    const r = corregirConteo(p, c);
    if(alHacer) alHacer(r);
  };
  inp.onkeydown = e => { if(e.key === "Enter") box.querySelector(".ok").click(); };
  return box;
}

/* Lo contado hoy, con su diferencia en unidades y en soles. */
function mostrarDiferencias(v){
  const hechos = cat.filter(p => p.visto === hoyISO() && p.hist && p.hist.length);
  if(!hechos.length) return;
  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Contados hoy · ' + hechos.length + '</h2>');
  let dif = 0;
  hechos.forEach(p => {
    const u = p.hist[p.hist.length - 1];
    const d = u.con - u.esp;
    dif += d * (p.costo || 0);
    const div = document.createElement("div");
    div.className = "prod";
    div.style.setProperty("--c", d === 0 ? "var(--verde)" : "var(--rojo)");
    div.innerHTML =
      '<div class="txt"><b>' + p.nom + '</b><span>había ' + u.esp +
        ' · contado ' + u.con + '</span></div>' +
      '<div class="der"><b class="dif ' + (d > 0 ? "mas" : d < 0 ? "menos" : "") + '">' +
        (d === 0 ? "exacto" : (d > 0 ? "+" : "") + d) + '</b>' +
        '<span>' + (d === 0 ? "" : soles(Math.abs(d * (p.costo || 0)))) + '</span></div>' +
      (u.corr ? '<div class="corr">corregido ' + u.corr + (u.corr > 1 ? " veces" : " vez") +
                '</div>' : '');
    v.appendChild(div);
    /* El error se ve aqui, mirando la lista de lo contado: que se pueda
       arreglar aqui mismo y no haya que ir a buscarlo. */
    const cc = controlConteo(p, () => vistaContar());
    cc.style.margin = "-4px 0 10px";
    v.appendChild(cc);
  });
  if(dif !== 0){
    v.insertAdjacentHTML("beforeend",
      '<div class="nota"><b>Diferencia de hoy: ' + (dif > 0 ? "+" : "") + soles(dif) + '</b><br>' +
      (dif < 0
        ? 'Falta mercadería que el sistema creía tener. Puede ser merma, robo, o ventas ' +
          'que no se descontaron. No se corrige solo: se mide y se vigila.'
        : 'Hay más de lo que el sistema creía. Suele ser mercadería que entró sin registrarse.') +
      '</div>');
  }
}

    'entra al Excel) y la copia de seguridad, que además guarda las fechas de cada conteo, ' +

    '<button class="btn sec" id="btnCompResp">Compartir solo la copia de seguridad</button>' +
    '<button class="btn sec" id="btnBajarCat">Descargar el catálogo (a Descargas)</button>' +
    '<button class="btn sec" id="btnRespaldo">Descargar la copia (a Descargas)</button>' +
    '<input type="file" id="archResp" accept="*/*">' +
    '<button class="btn sec" id="btnRestaurar">Restaurar desde una copia</button>' +
    '<h2 class="sec">Si el teléfono no te deja elegirlo</h2>' +
    '<div class="nota">Si al pulsar sale un menú con <b>Cámara</b> y <b>Grabadora</b>, ' +
    'desliza ese menú hacia los lados: suele haber un icono de <b>Archivos</b> o ' +
    '<b>Mis archivos</b> más allá. Si aun así no aparece, abre el CSV con cualquier ' +
    'app de texto, copia todo y pégalo aquí abajo.</div>' +
    '<div style="height:10px"></div>' +
    '<textarea id="pegar" rows="4" placeholder="Pega aquí el contenido del CSV"></textarea>' +
    '<button class="btn sec" id="btnPegar">Cargar lo pegado</button>';
  if(cat.length){
    const tot = cat.reduce((s,p) => s + valor(p), 0);
    $("#info").innerHTML = '<div class="nota"><b>Catálogo actual:</b> ' + cat.length +
      ' productos · ' + soles(tot) + '<br>Cargado el ' +
      (localStorage.getItem("promedic_inv_fecha") || "?") + '</div>';
  }
  const aviso = (t, mal) => {
    const c = $("#estadoCarga");
    if(c) c.innerHTML = '<div class="nota" style="border-color:' +
      (mal ? "var(--rojo)" : "var(--acento)") + '">' + t + '</div>';
  };
  $("#arch").onchange = e => {
    const f = e.target.files[0];
    if(!f) return aviso("No se seleccionó ningún archivo.", true);
    aviso("Leyendo <b>" + f.name + "</b> (" + Math.round(f.size/1024) + " KB)…");
    const l = new FileReader();
    /* onerror existe porque el navegador puede fallar al leer un archivo que
       si aparece en la lista (permisos, almacenamiento en la nube sin bajar).
       Sin esto, el usuario se queda mirando una pantalla que no dice nada. */
    l.onerror = () => aviso("El teléfono no pudo leer ese archivo. " +
      "Prueba a descargarlo de nuevo, o usa la opción de pegar el texto.", true);
    l.onload = ev => {
      try { importar(ev.target.result); }
      catch(err){ aviso("Error al procesar: " + err.message, true); }
    };
    l.readAsText(f, "utf-8");
  };
  $("#btnCompartir").onclick = compartirTodo;
  $("#btnCompResp").onclick  = compartirRespaldo;
  $("#btnBajarCat").onclick  = bajarCatalogo;
  $("#btnRespaldo").onclick  = bajarRespaldo;
  $("#btnRestaurar").onclick = () => {
    const f = $("#archResp").files[0];
    if(!f) return alert("Primero elige el archivo de copia (termina en .json).");
    const l = new FileReader();
    l.onerror = () => alert("El teléfono no pudo leer ese archivo.");
    l.onload = ev => restaurar(ev.target.result);
    l.readAsText(f, "utf-8");
  };
  $("#btnClave").onclick = async () => {
    const f = $("#clave").value.trim().toUpperCase();
    if(f.length < 8) return alert("Escribe la clave completa.");
    const c = $("#estadoClave");
    c.innerHTML = '<div class="nota">Descifrando…</div>';
    try {
      const csv = await descifrarCatalogo(f);
      importar(csv);
    } catch(e){
      c.innerHTML = '<div class="nota" style="border-color:var(--rojo)">' +
        '<b>Clave incorrecta.</b><br>Revisa que esté completa, con los guiones. ' +
        'No distingue mayúsculas de minúsculas.</div>';
    }
  };
  $("#btnPegar").onclick = () => {
    const t = $("#pegar").value.trim();
    if(t.length < 40) return alert("Pega el contenido completo del CSV.");
    try { importar(t); } catch(err){ aviso("Error al procesar: " + err.message, true); }
  };
}

/* Lector de CSV con comillas. No uso split(",") a secas porque los nombres
   de producto traen comas dentro ("LECHE 1L, X 2") y partirían la fila. */
function leerCSV(txt){
  txt = txt.replace(/^﻿/, "");
  /* El separador se detecta, no se asume: Excel en espanol guarda con ";"
     y en ingles con ",". Se mira la primera linea y gana el que mas
     aparezca fuera de comillas. */
  const prim = txt.split(/\r?\n/)[0] || "";
  const sinCom = prim.replace(/"[^"]*"/g, "");
  const sep = (sinCom.split(";").length > sinCom.split(",").length) ? ";" : ",";
  const filas = []; let f = [], campo = "", dentro = false;
  for(let i = 0; i < txt.length; i++){
    const c = txt[i];
    if(dentro){
      if(c === '"' && txt[i+1] === '"'){ campo += '"'; i++; }
      else if(c === '"') dentro = false;
      else campo += c;
    } else if(c === '"') dentro = true;
    else if(c === sep){ f.push(campo); campo = ""; }
    else if(c === "\n"){ f.push(campo); filas.push(f); f = []; campo = ""; }
    else if(c !== "\r") campo += c;
  }
  if(campo !== "" || f.length){ f.push(campo); filas.push(f); }
  return filas.filter(x => x.length > 1);
}

function importar(txt){
  let filas;
  try { filas = leerCSV(txt); } catch(e){ return alert("No pude leer el archivo: " + e.message); }
  if(filas.length < 2) return alert("El archivo está vacío o no es un CSV.\n\nSe leyeron " + filas.length + " línea(s).");
  const cab = filas[0].map(x => x.trim());
  const ix = n => cab.indexOf(n);
  const need = ["Id","Producto","Categoria","Costo","Stock","Vencimiento","ABC"];
  const falta = need.filter(n => ix(n) < 0);
  if(falta.length) return alert("Al archivo le faltan columnas: " + falta.join(", ") + "\n\nCabecera encontrada:\n" + cab.join(" | "));

  /* Lo YA CONTADO no se pierde al recargar el catalogo.
     Antes, importar reemplazaba el catalogo entero y se llevaba por delante
     la fecha de cada conteo, el historial y las ventas. El conto 150
     productos en dos dias: cargar un CSV le habria borrado ese trabajo y la
     cola habria vuelto a cero, sin avisar. Ahora se conserva por Id.

     El STOCK del archivo si manda: es lo que el archivo trae. Pero si el
     archivo es mas viejo que el ultimo conteo, gana el conteo — la
     mercaderia contada con la mano es mas fiable que un CSV de la semana
     pasada. */
  const antes = {};
  cat.forEach(p => { antes[p.id] = p; });
  const nuevo = [];
  let conservados = 0, stockDefendido = 0;
  for(let i = 1; i < filas.length; i++){
    const r = filas[i];
    if(!r[ix("Producto")]) continue;
    const id = r[ix("Id")];
    const v = antes[id];
    const p = {
      id: id, nom: r[ix("Producto")], cat: r[ix("Categoria")],
      costo: parseFloat(r[ix("Costo")]) || 0,
      stock: parseFloat(r[ix("Stock")]) || 0,
      venc: (r[ix("Vencimiento")] || "").trim(),
      abc: (r[ix("ABC")] || "C").trim(),
      aviso: ix("Aviso") >= 0 ? (r[ix("Aviso")] || "").trim() : "",
      marca: ix("Marca") >= 0 ? (r[ix("Marca")] || "").trim() : "",
      lote: ix("Lote") >= 0 ? (r[ix("Lote")] || "").trim() : "",
      pres: ix("Presentacion") >= 0 ? (r[ix("Presentacion")] || "").trim()
          : (ix("Presentación") >= 0 ? (r[ix("Presentación")] || "").trim() : "")
    };
    if(v){
      /* la marca que el escribio a mano no la pisa un archivo que venga vacio */
      if(!p.marca && v.marca) p.marca = v.marca;
      if(!p.lote && v.lote) p.lote = v.lote;
      if(!p.pres && v.pres) p.pres = v.pres;
      if(v.visto){ p.visto = v.visto; conservados++; }
      if(v.hist)   p.hist   = v.hist;
      if(v.ventas) p.ventas = v.ventas;
      /* el archivo trae una fecha de corte? si no, el conteo manda */
      const corte = (ix("Contado el") >= 0 ? (r[ix("Contado el")] || "").trim() : "");
      if(corte) p.visto = corte;
      else if(v.visto && v.visto >= (localStorage.getItem("promedic_inv_fecha") || "0000")){
        p.stock = v.stock; stockDefendido++;
      }
      if(ix("Contado el") >= 0 && corte) p.stock = parseFloat(r[ix("Stock")]) || 0;
    }
    nuevo.push(p);
  }
  if(!nuevo.length) return alert("No encontré productos en el archivo.");
  cat = nuevo;
  /* El CSV trae el stock del dia que se exporto, o sea ANTES de los retiros.
     Sin esto, recargar el catalogo resucitaria mercaderia vencida que el ya
     saco del estante — el peor error posible en una farmacia. */
  let revividos = 0;
  bajas.filter(b => !b.deshecha).forEach(b => {
    const p = cat.find(x => x.id === b.id);
    if(p && (p.stock || 0) > 0){ p.stock = 0; revividos++; }
  });
  if(!grabar()) return;
  try { localStorage.setItem("promedic_inv_fecha", new Date().toISOString().slice(0,10)); } catch(e){}
  pintarEstado();
  alert("Catálogo cargado: " + cat.length + " productos." +
        (conservados ? "\n\nSe conservó la fecha de conteo de " + conservados +
         " producto(s): recargar el catálogo NO borra lo que ya contaste." : "") +
        (stockDefendido ? "\n" + stockDefendido + " producto(s) mantuvieron el stock de tu " +
         "conteo, más reciente que el del archivo." : "") +
        (revividos ? "\n\n" + revividos + " producto(s) que ya habías retirado se " +
         "volvieron a poner en 0: el archivo traía el stock de antes del retiro." : ""));
  ir("resumen");
}

/* ---- navegación ---- */
const VISTAS = {resumen:vistaResumen, contar:vistaContar, vender:vistaVender,
                vencer:vistaVencer, buscar:vistaBuscar, datos:vistaDatos,
                detalle:vistaDetalle};
function ir(v){
  /* 'detalle' no tiene boton propio en la barra: se deja marcado Resumen, que
     es de donde se entra y a donde se vuelve. */
  const marcar = (v === "detalle") ? "resumen" : v;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === marcar));
  VISTAS[v]();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => ir(b.dataset.v));

/* ---- arranque ---- */
try { aplicarTema(localStorage.getItem("promedic_inv_tema") || "oscuro"); }
catch(e){ aplicarTema("oscuro"); }
pintarEstado();
ir(cat.length ? "resumen" : "datos");
</script>
