<!DOCTYPE html>
<!--
  PROMEDIC · Inventario    v0.7  (partes 1 y 2 de 3)
  ============================================================
  Autor:  Ing. Ángel Ybarra Rivas
  Para:   PROMEDIC · Rodríguez de Mendoza, Amazonas, Perú
  Año:    2026
  Uso personal. Si alguien quiere usarla, que mantenga este crédito.
  ------------------------------------------------------------
  PARTE 1 — lo que ya funciona:
    · Carga el catálogo desde INVENTARIO_CATALOGO.csv (700 productos).
    · VENCIMIENTOS con semáforo: vencidos, 30, 90 y 180 días.
    · Buscador de productos.
    · Resumen: valorización y clasificación ABC.

  PARTE 2 — hecha:
    · Cola de conteo diaria: ~17 productos, elegidos por clase ABC y por
      cuánto hace que no se miran. A cada 30 días, B cada 90, C cada 180.
    · Al contar se guarda la DIFERENCIA contra lo que decía el sistema.
      Esa diferencia es la medida de las mermas — no se tapa, se mide.
    · Si al producto le falta la fecha de vencimiento, la pide justo ahí:
      es el único momento en que tienes la caja en la mano.

  v0.3 — el selector de archivos rechazaba el CSV.
  El input tenia accept=".csv,text/csv". Android no mira la extension sino
  el tipo MIME que le puso la app que descargo el archivo (WhatsApp y el
  chat lo entregan como application/octet-stream o text/plain), asi que el
  archivo salia DESACTIVADO en la lista: se tocaba y no pasaba nada.
  Quitado el filtro; ahora se valida por contenido. Se anadio aviso de
  lectura, control de error y una caja para pegar el CSV como alternativa.

  v0.4 — sin accept, Android abria el menu "elige una accion" con Camara y
  Grabadora, sin explorador de archivos. accept="*/*" es el punto medio:
  Chrome abre el explorador y no desactiva ningun archivo por su tipo.

  PARTE 3 (siguiente) — reposiciones desde las facturas, consumo aparente
  y rotacion real por producto.

  Por qué el catálogo se IMPORTA y no viene dentro del archivo:
  el inventario cambia. Si estuviera escrito aquí dentro, cada cambio
  obligaría a rehacer la app. Importándolo, tú actualizas el CSV y la
  app lo lee. Es el mismo principio que usamos con los movimientos.
-->
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="author" content="Ing. Ángel Ybarra Rivas">
<meta name="description" content="Control de inventario de PROMEDIC. Autor: Ing. Ángel Ybarra Rivas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PROMEDIC · Inventario</title>
<style>
/* ---- 1) APARIENCIA ---------------------------------------------------
   Misma familia visual que la app de registro, pero con acento distinto
   (cian en vez de esmeralda) para que no confundas una con otra.      */
:root{
  --fondo:#0B1120; --sup:#141E33; --sup2:#1B2740; --linea:#26344D;
  --texto:#F1F5F9; --suave:#8FA3BF; --sombra:0 10px 30px rgba(0,0,0,.35);
  --acento:#06B6D4; --acento2:#22D3EE;
  --rojo:#F43F5E; --ambar:#F59E0B; --amarillo:#EAB308; --verde:#10B981;
}
html[data-tema="claro"]{
  --fondo:#F4F6FB; --sup:#FFFFFF; --sup2:#F8FAFC; --linea:#E4E9F2;
  --texto:#0B1120; --suave:#64748B; --sombra:0 8px 24px rgba(15,23,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 92px;background:var(--fondo);color:var(--texto);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:300px;z-index:0;
  background:radial-gradient(120% 100% at 50% -20%,var(--acento),transparent 70%);
  opacity:.18;pointer-events:none}
html[data-tema="claro"] body::before{opacity:.08}

header{position:sticky;top:0;z-index:6;backdrop-filter:blur(14px);
  background:var(--fondo);border-bottom:1px solid var(--linea);padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acento),var(--acento2));
  color:#04121C;font-weight:800;font-size:13px}
.marca h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.marca small{display:block;font-size:10.5px;color:var(--suave)}
.tema{background:var(--sup);border:1px solid var(--linea);color:var(--texto);
  width:36px;height:36px;border-radius:11px;font-size:15px;cursor:pointer;flex:none}

/* franja de estado: aparte del encabezado, para que nunca se solapen */
.estado{position:sticky;top:59px;z-index:5;background:var(--sup);
  border-bottom:1px solid var(--linea);padding:8px 18px;
  font-size:11.5px;color:var(--suave);text-align:center;line-height:1.5}
.estado b{color:var(--acento)}
.estado .mal{color:var(--rojo)}

main{position:relative;z-index:1;padding:18px;max-width:620px;margin:0 auto}

h2.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--suave);
  margin:22px 0 10px;font-weight:700}
h2.sec:first-child{margin-top:0}

/* tarjetas de resumen */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--sup);border:1px solid var(--linea);border-radius:16px;padding:14px}
.kpi small{display:block;font-size:10px;color:var(--suave);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px;font-weight:650}
.kpi b{font-size:20px;font-weight:750;letter-spacing:-.5px;display:block}
.kpi.alerta{border-color:var(--rojo)}
.kpi.alerta b{color:var(--rojo)}
.kpi.aviso{border-color:var(--ambar)}
.kpi.aviso b{color:var(--ambar)}

/* v0.23 — LAS TARJETAS SE TOCAN.
   Su pedido: "quiero poder tocar un cuadro en el dashboard y que me lleve a
   esa info detallada". Antes el numero estaba a la vista pero no habia forma
   de ver QUE productos lo componian sin buscarlos uno por uno. */
.kpi.tocable{cursor:pointer;position:relative;transition:transform .08s,border-color .15s}
.kpi.tocable:active{transform:scale(.985)}
.kpi.tocable::after{content:"ver ›";position:absolute;right:12px;top:12px;
  font-size:10px;color:var(--suave);letter-spacing:.3px}
.kpi.tocable:hover{border-color:var(--acento)}
.volver{background:none;border:none;color:var(--acento);font-family:inherit;font-size:13px;
  font-weight:650;cursor:pointer;padding:4px 0;margin-bottom:6px}
.cabDet{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin:2px 0 12px;flex-wrap:wrap}
.cabDet .tot{font-size:12px;color:var(--suave)}

/* fila de producto */
.prod{background:var(--sup);border:1px solid var(--linea);border-left:3px solid var(--c,var(--linea));
  border-radius:13px;padding:11px 13px;margin-bottom:7px;display:flex;gap:10px;
  justify-content:space-between;align-items:center}
.prod .txt{min-width:0;font-size:13px;line-height:1.45}
.prod .txt b{display:block;font-size:13.5px;font-weight:620;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prod .txt span{color:var(--suave);font-size:11px}
.prod .der{text-align:right;white-space:nowrap;flex:none}
.prod .der b{font-size:14px;font-weight:750;display:block}
.prod .der span{font-size:10.5px;color:var(--suave)}
.pastilla{font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 5px;border-radius:5px;
  margin-right:5px;vertical-align:1px;display:inline-block}
.abcA{background:#F43F5E;color:#2B0410}
.abcB{background:#F59E0B;color:#2B1A04}
.abcC{background:#64748B;color:#0B1120}

.vacio{color:var(--suave);font-size:12.5px;padding:22px 14px;text-align:center;
  border:1px dashed var(--linea);border-radius:14px;line-height:1.6}
textarea{width:100%;padding:12px;border:1px solid var(--linea);border-radius:13px;
  font-size:13px;font-family:inherit;background:var(--sup);color:var(--texto);resize:vertical}
input[type=text],input[type=file],select{width:100%;padding:12px;border:1px solid var(--linea);
  border-radius:13px;font-size:15px;font-family:inherit;background:var(--sup);color:var(--texto)}
.btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:14.5px;font-weight:750;
  font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--acento),var(--acento2));
  color:#04121C;box-shadow:var(--sombra);margin-top:12px}
.btn.sec{background:var(--sup);color:var(--texto);border:1px solid var(--linea);box-shadow:none}
.nota{background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:14px;
  font-size:12.5px;line-height:1.6;color:var(--suave);margin-top:16px}
.nota b{color:var(--texto)}

/* buscador con X para limpiar */
.busca{position:relative}
.busca input{padding-right:44px}
.busca button{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;
  width:32px;height:32px;border-radius:9px;border:none;background:var(--sup2);
  color:var(--suave);font-size:19px;line-height:1;cursor:pointer;font-family:inherit}
.busca button:active{background:var(--linea)}

/* venta rapida: SOLO clase A */
.vr.cta button{background:var(--acento);color:#04121A}
.corr{font-size:11px;color:var(--suave);padding:0 12px 8px}
.juntada{background:var(--sup);border:1px dashed var(--linea);border-radius:12px;
  padding:10px 12px;margin:-4px 0 8px;font-size:12.5px;color:var(--suave);line-height:1.45}
.juntada b{color:var(--texto)}
.vr{display:flex;gap:7px;margin-top:9px;align-items:center}
.vr input{flex:1 1 auto;min-width:0;padding:9px 6px;text-align:center;font-size:15px;
  font-weight:700;border:1px solid var(--linea);border-radius:10px;background:var(--sup2);
  color:var(--texto)}
.vr button{flex:0 0 74px;padding:9px 4px;border:none;border-radius:10px;font-family:inherit;
  font-size:12px;font-weight:750;cursor:pointer;background:var(--rojo);color:#2B0410}
.vr button.uno{flex:0 0 46px;background:var(--sup2);color:var(--texto);
  border:1px solid var(--linea);font-size:15px}
.vr button.uno:active{background:var(--rojo);color:#2B0410}
.vr small{flex:0 0 auto;font-size:10.5px;color:var(--suave)}

/* retiro de vencidos: uno por uno, con confirmacion */
.ret{display:flex;gap:7px;margin-top:9px;align-items:center}
.ret button{flex:1 1 auto;padding:10px 6px;border-radius:10px;font-family:inherit;
  font-size:12.5px;font-weight:750;cursor:pointer;border:1px solid var(--rojo);
  background:transparent;color:var(--rojo)}
.ret button:active{background:var(--rojo);color:#2B0410}
.ret button.des{border-color:var(--linea);color:var(--suave)}
.ret button.des:active{background:var(--linea);color:var(--texto)}
.barra{background:var(--sup);border:1px solid var(--linea);border-radius:14px;
  padding:13px 14px;margin-bottom:10px}
.barra .lin{display:flex;justify-content:space-between;font-size:12.5px;
  color:var(--suave);margin-bottom:9px}
.barra .lin b{color:var(--texto);font-size:13.5px}
.barra .riel{height:8px;background:var(--sup2);border-radius:5px;overflow:hidden}
.barra .riel i{display:block;height:100%;background:var(--verde);border-radius:5px;
  transition:width .25s}
.hecho{opacity:.62}
.hecho .der b{color:var(--verde)}

/* de que lote estamos hablando */
.lote{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin:-3px -4px 8px;padding:5px 9px;border-radius:9px;
  background:var(--sup2);border:1px solid var(--linea)}
.lote b{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--acento)}
.lote span{font-size:10.5px;color:var(--texto);font-weight:650}
.mk{color:var(--acento);font-weight:750;letter-spacing:.2px}
/* La presentacion va como pastilla y no como texto suelto: cuando dos
   productos solo se diferencian en el volumen, el nombre largo se corta y
   el numero que los distingue es justo el que desaparece. */
.pres{display:inline-block;background:var(--sup2);border:1px solid var(--linea);
  color:var(--texto);font-size:10px;font-weight:800;letter-spacing:.3px;
  padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.edit{margin-top:9px;padding:10px;border:1px dashed var(--linea);border-radius:11px;
  background:var(--sup2)}
.edit .tit{font-size:12.5px;color:var(--suave);margin:0 0 9px}
.edit .tit b{color:var(--texto)}
.edit label{display:block;font-size:10.5px;color:var(--suave);margin:0 0 4px}
.edit input{width:100%;padding:10px;border:1px solid var(--linea);border-radius:10px;
  font-size:14px;font-family:inherit;background:var(--sup);color:var(--texto);margin-bottom:9px}
.edit .fin{display:flex;gap:7px}
.edit .fin button{flex:1;padding:10px;border:none;border-radius:10px;font-family:inherit;
  font-size:12.5px;font-weight:750;cursor:pointer}
.edit .fin .ok{background:var(--acento);color:#04121C}
.edit .fin .no{background:var(--sup);color:var(--suave);border:1px solid var(--linea)}
.lapiz{background:none;border:1px solid var(--linea);color:var(--suave);border-radius:9px;
  padding:6px 10px;font-family:inherit;font-size:11px;cursor:pointer;margin-top:8px}
.otros{font-size:10.5px;color:var(--suave);margin-top:5px;line-height:1.5;
  padding-left:9px;border-left:2px solid var(--linea)}
.lote.igual{background:rgba(244,63,94,.12);border-color:var(--rojo)}
.lote.igual b{color:var(--rojo)}
.mismacaja{font-size:11px;line-height:1.5;color:var(--texto);background:rgba(244,63,94,.09);
  border:1px solid var(--rojo);border-radius:9px;padding:8px 10px;margin:-4px -4px 8px}
.mismacaja b{color:var(--rojo)}

/* conteo del dia */
.cnt{background:var(--sup);border:1px solid var(--linea);border-left:3px solid var(--c,var(--linea));
  border-radius:13px;padding:12px 13px;margin-bottom:8px}
.cnt .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cnt .cab b{font-size:13.5px;font-weight:620;line-height:1.35}
.cnt .cab .esp{font-size:11px;color:var(--suave);white-space:nowrap;text-align:right;flex:none}
.cnt .sub{color:var(--suave);font-size:11px;margin-top:3px}
.cnt .fila{display:flex;gap:8px;margin-top:10px;align-items:center}
.cnt .fila input{flex:1 1 auto;min-width:0;padding:11px 6px;text-align:center;font-size:17px;
  font-weight:700;border:1px solid var(--linea);border-radius:11px;background:var(--sup2);
  color:var(--texto)}
.cnt .fila button{flex:0 0 78px;padding:11px 4px;border:none;border-radius:11px;font-family:inherit;
  font-size:13px;font-weight:750;cursor:pointer;
  background:linear-gradient(135deg,var(--acento),var(--acento2));color:#04121C}
.cnt .fila button.sec{background:var(--sup2);color:var(--suave);border:1px solid var(--linea);
  flex:0 0 54px;font-size:11.5px}
.cnt .fecha{margin-top:8px}
.cnt .fecha input{width:100%;padding:10px;border:1px solid var(--ambar);border-radius:11px;
  background:var(--sup2);color:var(--texto);font-family:inherit;font-size:14px}
.cnt .fecha small{display:block;color:var(--ambar);font-size:11px;margin-bottom:5px;font-weight:650}
.cnt.ok{opacity:.5;border-left-color:var(--verde)}
.barra{height:7px;background:var(--sup2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),var(--acento2))}
.dif{font-weight:750}
.dif.mas{color:var(--verde)} .dif.menos{color:var(--rojo)}

/* barra inferior de secciones */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--fondo);
  border-top:1px solid var(--linea);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:6px;max-width:620px;margin:0 auto}
.nav button{flex:1;padding:10px 4px;border:none;background:none;color:var(--suave);
  font-family:inherit;font-size:10.5px;font-weight:650;cursor:pointer;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:17px}
.nav button{font-size:9.5px;padding:10px 2px;gap:2px}
.nav button.on{color:var(--acento);background:var(--sup)}
.nav button:disabled{opacity:.35}

footer{text-align:center;padding:24px 16px 6px;color:var(--suave);font-size:11px;line-height:1.8}
footer b{color:var(--texto);font-weight:650}
footer .v{display:inline-block;margin-top:6px;padding:3px 11px;border:1px solid var(--linea);
  border-radius:999px;font-size:10px;background:var(--sup)}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="logo">I</div>
    <div><h1>PROMEDIC</h1><small>Inventario</small></div>
  </div>
  <button class="tema" id="btnTema" title="Cambiar tema">☀️</button>
</header>

<div class="estado" id="estado">Sin catálogo cargado</div>

<main id="vista"></main>

<div class="nav">
  <button data-v="resumen" class="on"><span class="ic">📊</span>Resumen</button>
  <button data-v="contar"><span class="ic">✅</span>Contar</button>
  <button data-v="vender"><span class="ic">💰</span>Vender</button>
  <button data-v="vencer"><span class="ic">⏳</span>Vencen</button>
  <button data-v="buscar"><span class="ic">🔍</span>Buscar</button>

<script>
/* ---- 2) COMPORTAMIENTO ---------------------------------------------- */

const VERSION = "v0.23";

/* ---------- CATALOGO CIFRADO -----------------------------------------
   El catalogo viaja DENTRO de la app, pero cifrado con AES-256-GCM.
   Quien abra la URL y mire el codigo fuente solo ve un bloque de base64
   sin sentido: sin la clave no hay forma de leer costos ni stock.

   La clave de cifrado no esta aqui: se deriva de la frase que tu escribes,
   con PBKDF2-SHA256 y 250.000 iteraciones. Esas iteraciones son a proposito:
   hacen que probar claves al azar cueste tiempo de computo real.

   Se escribe UNA vez. Despues el catalogo queda descifrado en este telefono
   y la app abre directo.                                                */
async function descifrarCatalogo(frase){
  const b = JSON.parse(document.getElementById("cifrado").textContent);
  const bin = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(frase),
                                             "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:bin(b.s), iterations:b.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  /* AES-GCM verifica la integridad: si la frase esta mal, esto lanza error.
     No hace falta comprobar nada mas — el propio cifrado lo detecta. */
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:bin(b.iv)}, k, bin(b.d));
  return new TextDecoder("utf-8").decode(pt);
}
const $ = s => document.querySelector(s);
const num = n => (n || 0).toLocaleString("es-PE", {minimumFractionDigits:2, maximumFractionDigits:2});
const soles = n => "S/ " + num(n);

/* --- tema --- */
function aplicarTema(t){
  document.documentElement.dataset.tema = t;
  $("#btnTema").textContent = t === "oscuro" ? "☀️" : "🌙";
  try { localStorage.setItem("promedic_inv_tema", t); } catch(e){}
}
$("#btnTema").onclick = () =>
  aplicarTema(document.documentElement.dataset.tema === "oscuro" ? "claro" : "oscuro");

/* --- datos --- */
let cat = [];                 /* el catálogo completo */
try { cat = JSON.parse(localStorage.getItem("promedic_inv") || "[]"); } catch(e){ cat = []; }
function grabar(){
  try { localStorage.setItem("promedic_inv", JSON.stringify(cat)); return true; }
  catch(e){
    alert("No se pudo guardar el catálogo en este teléfono: " + e.message);
    return false;
  }
}

/* ---- BAJAS ----------------------------------------------------------
   Retirar un vencido NO borra el producto: le pone stock 0 y deja
   constancia aqui. El producto sigue existiendo porque lo que se acabo
   es ese lote, no el producto; si lo borraramos, la proxima compra
   entraria como producto nuevo y se perderia el historico.

   Se guarda aparte del catalogo a proposito: asi sobrevive a una
   recarga del CSV, que reemplaza el catalogo entero. Es tambien el
   acta que hace falta para el traspaso: que se retiro, cuando, cuanto
   valia y por que.                                                     */
let bajas = [];
try { bajas = JSON.parse(localStorage.getItem("promedic_inv_bajas") || "[]"); } catch(e){ bajas = []; }
function grabarBajas(){
  try { localStorage.setItem("promedic_inv_bajas", JSON.stringify(bajas)); return true; }
  catch(e){ alert("No se pudo guardar el registro de retiros: " + e.message); return false; }
}
const bajaDe = id => bajas.find(b => b.id === id && !b.deshecha);

/* Retira UN producto. Nunca varios: el se lo pidio asi, y tiene razon —
   un boton que vacia 24 productos de golpe es un boton que algun dia se
   toca sin querer. */
function retirar(p, motivo){
  const q = p.stock || 0;
  bajas.push({id:p.id, nom:p.nom, cat:p.cat, q:q, costo:p.costo || 0,
              valor:+(q * (p.costo || 0)).toFixed(2), venc:p.venc,
              motivo:motivo || "vencido", f:hoyISO(),
              h:new Date().toTimeString().slice(0,5)});
  p.stock = 0;
  grabar(); grabarBajas(); pintarEstado();
}

/* Deshacer: devuelve el stock exacto que tenia. Existe porque el paso
   fisico y el digital no siempre ocurren en el mismo minuto. */
function deshacerBaja(b){
  const p = cat.find(x => x.id === b.id);
  if(p) p.stock = (p.stock || 0) + b.q;
  b.deshecha = true;
  grabar(); grabarBajas(); pintarEstado();
}

/* Separador PUNTO Y COMA, no coma.
   Su Excel esta en espanol y espera ";". Con "," le mete las diez columnas
   dentro de la columna A y el archivo se ve ilegible: le paso con el acta
   y volvio a pasar con otro CSV que le mande. El BOM de delante es para
   que respete las tildes. */
const SEP = ";";
function actaCSV(){
  const esc = t => '"' + String(t == null ? "" : t).replace(/"/g, '""') + '"';
  const l = [["Fecha","Hora","Producto","Id","Categoria","Motivo","Unidades",
              "Costo unitario","Valor retirado","Vencimiento"].join(SEP)];
  bajas.filter(b => !b.deshecha).forEach(b => l.push([b.f, b.h, esc(b.nom), esc(b.id), esc(b.cat),
    b.motivo, b.q, (b.costo || 0).toFixed(4), (b.valor || 0).toFixed(2), b.venc || ""].join(SEP)));
  return l.join("\r\n");
}

/* ---- SALIDA DE DATOS ------------------------------------------------
   Hasta la v0.12 la app era una calle de un solo sentido: se cargaba el
   catalogo y nada podia salir. Sus 150 conteos y los 24 retiros vivian
   solo en este telefono, sin forma de verlos desde la laptop ni de
   recuperarlos si el telefono se pierde o se limpia el navegador.

   Dos salidas, para dos cosas distintas:
   - CSV del catalogo: para la laptop y para el Excel. Lleva el stock real
     y la fecha de cada conteo, asi que al volver a entrar no se pisa nada.
   - Copia de seguridad JSON: TODO, incluido el historial de conteos, las
     ventas y las bajas. Es lo que se restaura si hay que empezar de cero.  */
function bajar(nombre, texto, tipo){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + texto], {type: tipo}));
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---- COMPARTIR (v0.18) ----------------------------------------------
   Descargar deja el archivo en Descargas y hay que ir a buscarlo. Con el
   menu del telefono el archivo sale directo a WhatsApp, sin explorador.

   Cuatro cosas que no son obvias y que ya costaron leerlas dos veces:

   1. navigator.share solo existe en HTTPS. En la URL de Vercel si; si el
      abre el index.html desde el propio telefono con file://, no. Por eso
      SIEMPRE hay un plan B que descarga: nunca se queda sin salida.

   2. Hay que llamarlo dentro del toque del usuario y sin esperar nada
      antes. Un solo await previo gasta el permiso del toque y el menu ya
      no abre (NotAllowedError). Por eso los archivos se arman en memoria,
      que es instantaneo, y share() se llama de una.

   3. canShare({files}) hay que preguntarlo aparte: hay navegadores que
      comparten texto pero no archivos, y otros que aceptan uno y no dos.

   4. Si cierra el menu sin elegir, share() lanza AbortError. Eso NO es un
      error: cambio de opinion. No se le avisa nada ni se le descarga el
      archivo a la fuerza, que seria hacer justo lo que no pidio.        */
function archivoDe(nombre, texto, tipo){
  /* Mismo BOM que la descarga. Sin el, su Excel abre el CSV con las
     tildes rotas. La copia JSON tambien lo lleva, y restaurar() y el
     lector de la laptop ya lo saben quitar. */
  return new File(["\ufeff" + texto], nombre, {type: tipo});
}

function seComparte(archivos){
  try { return !!(navigator.share && navigator.canShare &&
                  navigator.canShare({files: archivos})); }
  catch(e){ return false; }   // canShare tira en algunos navegadores viejos
}

function compartir(archivos, planB){
  if(!seComparte(archivos)){ planB(); return false; }
  navigator.share({files: archivos}).catch(err => {
    if(err && err.name === "AbortError") return;   // cerro el menu, y ya
    planB();
  });
  return true;
}

function respaldoJSON(){
  return JSON.stringify({app:"PROMEDIC inventario", version:VERSION, fecha:hoyISO(),
                         catalogo:cat, bajas:bajas,
                         cargado:localStorage.getItem("promedic_inv_fecha") || ""});
}

/* Los DOS archivos de una sola vez, porque los dos hacen falta y mandar
   uno solo es el error facil: el catalogo lleva el stock, pero el
   historial de conteos, las ventas descontadas y los retiros viven en la
   copia. Con el catalogo solo, la mitad del trabajo del dia no viaja. */
function compartirTodo(){
  if(!cat.length) return alert("No hay catálogo cargado.");
  const f = hoyISO();
  const csv  = archivoDe("INVENTARIO_CATALOGO_" + f + ".csv", catalogoCSV(), "text/csv");
  const json = archivoDe("respaldo_inventario_" + f + ".json", respaldoJSON(), "application/json");
  const ambos = () => { bajarCatalogo(); bajarRespaldo(); };

  if(seComparte([csv, json])){
    compartir([csv, json], ambos);
    return notaComp("Se abrió el menú del teléfono con los <b>dos</b> archivos.");
  }
  if(seComparte([csv])){
    compartir([csv], bajarCatalogo);
    return notaComp("Este teléfono solo deja mandar <b>un</b> archivo por vez. " +
      "Va el catálogo. La copia de seguridad mándala aparte con el botón de abajo.", true);
  }
  ambos();
  notaComp("Este navegador no tiene menú de compartir. Los dos archivos quedaron " +
           "en <b>Descargas</b>. Si estás en la dirección de internet y aun así sale " +
           "esto, avísame.", true);
}

function compartirRespaldo(){
  if(!cat.length) return alert("No hay nada que respaldar.");
  const j = archivoDe("respaldo_inventario_" + hoyISO() + ".json", respaldoJSON(),
                      "application/json");
  if(!compartir([j], bajarRespaldo))
    notaComp("Sin menú de compartir: la copia quedó en <b>Descargas</b>.", true);
}

function notaComp(t, ojo){
  const c = document.getElementById("estadoComp");
  if(c) c.innerHTML = '<div class="nota" style="border-color:' +
    (ojo ? "var(--ambar, var(--linea))" : "var(--acento)") + '">' + t + '</div>';
}

function catalogoCSV(){
  const esc = t => '"' + String(t == null ? "" : t).replace(/"/g, '""') + '"';
  const cab = ["Id","Producto","Marca","Presentacion","Categoria","Costo","Stock","Vencimiento",
               "Lote","ABC","Aviso","Contado el","Conteos hechos","Ventas registradas"];
  const l = [cab.join(SEP)];
  cat.forEach(p => l.push([
    esc(p.id), esc(p.nom), esc(p.marca || ""), esc(p.pres || ""), esc(p.cat),
    (p.costo || 0).toFixed(4), (p.stock || 0),
    p.venc || "", esc(p.lote || ""), p.abc || "", esc(p.aviso || ""), p.visto || "",
    (p.hist || []).length,
    (p.ventas || []).reduce((s, v) => s + (v.q || 0), 0)
  ].join(SEP)));
  return l.join("\r\n");
}

function bajarCatalogo(){
  if(!cat.length) return alert("No hay catálogo cargado.");
  bajar("INVENTARIO_CATALOGO_" + hoyISO() + ".csv", catalogoCSV(),
        "text/csv;charset=utf-8");
}

function bajarRespaldo(){
  if(!cat.length) return alert("No hay nada que respaldar.");
  /* La copia se arma en respaldoJSON() y NO se duplica aqui: si el dia de
     manana se agrega un campo, tiene que salir igual por descarga y por
     compartir. Dos copias del mismo armado es como se llega a que un
     boton mande algo distinto del otro. */
  bajar("respaldo_inventario_" + hoyISO() + ".json", respaldoJSON(),
        "application/json;charset=utf-8");
}

function restaurar(txt){
  let d;
  try { d = JSON.parse(txt.replace(/^\ufeff/, "")); }
  catch(e){ return alert("Ese archivo no es una copia de seguridad válida."); }
  if(!d || !Array.isArray(d.catalogo) || !d.catalogo.length)
    return alert("Esa copia no trae catálogo.");
  if(!confirm("Vas a reemplazar TODO lo que hay en este teléfono por la copia del " +
              (d.fecha || "?") + ".\n\n" + d.catalogo.length + " productos. ¿Seguro?"))
    return;
  cat = d.catalogo;
  bajas = Array.isArray(d.bajas) ? d.bajas : [];
  grabar(); grabarBajas();
  try { localStorage.setItem("promedic_inv_fecha", d.cargado || d.fecha || hoyISO()); } catch(e){}
  pintarEstado();
  alert("Restaurado: " + cat.length + " productos y " + bajas.length + " retiro(s).");
  ir("resumen");
}

function compartirActa(){
  const vivas = bajas.filter(b => !b.deshecha);
  if(!vivas.length) return alert("Todavía no has retirado nada.");
  compartir([archivoDe("acta_retiro_" + hoyISO() + ".csv", actaCSV(), "text/csv")],
            bajarActa);
}

function bajarActa(){
  const vivas = bajas.filter(b => !b.deshecha);
  if(!vivas.length) return alert("Todavia no has retirado nada.");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + actaCSV()], {type:"text/csv;charset=utf-8"}));
  a.download = "acta_retiro_" + hoyISO() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Días que faltan para una fecha "AAAA-MM-DD".
   Se compara a medianoche para que "hoy" sea 0 y no 0.4 de un día. */
function diasPara(iso){
  if(!iso) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const p = iso.split("-");
  return Math.round((new Date(+p[0], +p[1]-1, +p[2]) - hoy) / 86400000);
}

/* El semáforo. Los cortes no son caprichosos:
   <0    ya vencido        → retirar del estante, es sanitario
   <30   último mes        → liquidar ya
   <90   tres meses        → aún se puede devolver o promocionar
   <180  seis meses        → vigilar, no comprar más de eso        */
function franja(d){
  if(d === null) return null;
  if(d < 0)   return {k:"vencido", t:"VENCIDO",  c:"var(--rojo)"};
  if(d < 30)  return {k:"d30",     t:"< 30 días", c:"var(--rojo)"};
  if(d < 90)  return {k:"d90",     t:"< 90 días", c:"var(--ambar)"};
  if(d < 180) return {k:"d180",    t:"< 6 meses", c:"var(--amarillo)"};
  return null;
}
const valor = p => (p.costo || 0) * (p.stock || 0);

/* El stock NO es lo que hay ahora: es lo que habia el dia del conteo.
   Entre conteo y conteo se queda viejo, y eso es normal — la diferencia
   es justamente lo que vendiste. Por eso el numero SIEMPRE sale con su
   fecha: sin ella induce a error, y de hecho ya lo hizo. */
function textoStock(p){
  const s = "stock " + (p.stock || 0);
  if(!p.visto) return s + " · sin contar";
  const d = desdeConteo(p);
  if(d === 0) return s + " · contado hoy";
  if(d === 1) return s + " · contado ayer";
  return s + " · al " + fmtFecha(p.visto) + " (" + d + " d)";
}
const conStock = p => (p.stock || 0) > 0 && !p.fusion;

function pintarEstado(){
  const e = $("#estado");
  if(!cat.length){ e.innerHTML = "Sin catálogo cargado"; return; }
  const tot = cat.reduce((s,p) => s + valor(p), 0);
  const venc = cat.filter(p => conStock(p) && diasPara(p.venc) < 0 && p.venc).length;
  e.innerHTML = "<b>" + cat.length + "</b> productos · <b>" + soles(tot) + "</b>" +
    (venc ? ' · <b class="mal">' + venc + "</b> vencidos con stock" : "");
}

/* ---- vistas ---- */
/* " · lote 2 de 3" cuando el mismo producto esta en varias filas.
   Va en TODAS las pantallas, no solo en la de contar: en Buscar y en
   Vender tambien salian dos filas iguales sin forma de distinguirlas. */
function marcaLote(p){
  const l = lotesDe(p);
  if(l.length < 2) return "";
  return ' · lote ' + (l.findIndex(x => x.id === p.id) + 1) + ' de ' + l.length;
}

function filaProd(p, extra){
  const d = diasPara(p.venc), f = franja(d);
  const div = document.createElement("div");
  div.className = "prod";
  if(f) div.style.setProperty("--c", f.c);
  const plazo = p.venc
    ? (d < 0 ? "venció hace " + (-d) + " d" : (d === 0 ? "vence HOY" : "vence en " + d + " d"))
    : "sin fecha";
  div.innerHTML =
    '<div class="txt"><b><span class="pastilla abc' + p.abc + '">' + p.abc + '</span>' +
      p.nom + (p.pres ? '<span class="pres">' + p.pres + '</span>' : '') + '</b>' +
    '<span>' + (p.marca ? '<b class="mk">' + p.marca + '</b> · ' : '') +
      p.cat + ' · ' + textoStock(p) + ' · ' + plazo + marcaLote(p) +
      (p.aviso ? ' · ⚠ ' + p.aviso : '') + '</span></div>' +
    '<div class="der"><b>' + soles(valor(p)) + '</b><span>' +
      (extra || (fmtFecha(p.venc) || "—")) + '</span></div>';
  return div;
}

function vistaResumen(){
  const v = $("#vista"); v.innerHTML = "";
  if(!cat.length) return sinCatalogo(v);

  const tot = cat.reduce((s,p) => s + valor(p), 0);
  const vencidos = cat.filter(p => conStock(p) && p.venc && diasPara(p.venc) < 0);
  const d90 = cat.filter(p => { const d = diasPara(p.venc); return conStock(p) && d !== null && d >= 0 && d < 90; });
  const cero = cat.filter(p => !conStock(p));
  const conStk = cat.filter(conStock);
  const vv = a => a.reduce((s,p) => s + valor(p), 0);

  v.innerHTML = '<h2 class="sec">Tu inventario hoy</h2>';
  const g = document.createElement("div"); g.className = "kpis";
  /* v0.23: cada tarjeta lleva su lista dentro. Una tarjeta sin productos NO se
     hace tocable — abrir una pantalla vacia es peor que no poder abrirla. */
  const kpi = (t, val, sub, cls, id) =>
    '<div class="kpi ' + (cls||"") + (id ? " tocable" : "") + '"' + (id ? ' data-det="'+id+'"' : '') +
    '><small>' + t + '</small><b>' + val + '</b>' +
    '<span style="font-size:11px;color:var(--suave)">' + sub + '</span></div>';
  g.innerHTML =
    kpi("Valorizado", soles(tot), cat.length + " productos", "", conStk.length ? "stock" : "") +
    kpi("Ya vencido", soles(vv(vencidos)), vencidos.length + " con stock",
        vencidos.length ? "alerta" : "", vencidos.length ? "vencidos" : "") +
    kpi("Vence en 90 días", soles(vv(d90)), d90.length + " productos",
        d90.length ? "aviso" : "", d90.length ? "d90" : "") +
    kpi("Sin stock", cero.length, "productos en cero", "", cero.length ? "cero" : "");
  v.appendChild(g);
  g.querySelectorAll("[data-det]").forEach(el =>
    el.onclick = () => abrirDetalle(el.dataset.det));

  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Dónde está tu dinero (ABC)</h2>');
  ["A","B","C"].forEach(k => {
    const l = cat.filter(p => p.abc === k);
    const pct = tot ? (100 * vv(l) / tot) : 0;
    const d = document.createElement("div");
    d.className = "prod";
    d.style.setProperty("--c", k === "A" ? "var(--rojo)" : k === "B" ? "var(--ambar)" : "var(--suave)");
    d.innerHTML =
      '<div class="txt"><b><span class="pastilla abc' + k + '">' + k + '</span>' +
        (k === "A" ? "Lo que más importa" : k === "B" ? "Importancia media" : "Cola larga") + '</b>' +
      '<span>' + l.length + " productos · " + Math.round(100*l.length/cat.length) + '% del catálogo</span></div>' +
      '<div class="der"><b>' + soles(vv(l)) + '</b><span>' + pct.toFixed(1) + '% del dinero</span></div>';
    v.appendChild(d);
  });

  v.insertAdjacentHTML("beforeend",
    '<div class="nota"><b>Cómo leer esto:</b> la clase A son los productos donde está el 80% ' +
    'de tu dinero. Son los que hay que contar seguido. La clase C son 200 y pico de productos ' +
    'que juntos no llegan al 5% — contarlos cada semana sería regalar tu tiempo.</div>');
}

/* ══════════════════════════════════════════════════════════════════════
   v0.23 — DETALLE DE UNA TARJETA
   Su pedido: "doy click al recuadro de los que vencen en 90 dias y me los
   trae todos a pantalla". Una sola vista generica sirve para las cuatro
   tarjetas: cambia la lista y el orden, no la pantalla.
   ══════════════════════════════════════════════════════════════════════ */
let detalleQue = null;

const DETALLES = {
  stock: {
    titulo: "Todo lo que tienes en estante",
    nota: "Ordenado por plata en estante: arriba lo que mas pesa en tu inventario.",
    lista: () => cat.filter(conStock).sort((a,b) => valor(b) - valor(a))
  },
  vencidos: {
    titulo: "Ya vencido y todavia con stock",
    nota: "Esto no se vende: se retira. La pantalla Vencen te lleva del retiro paso a paso.",
    lista: () => cat.filter(p => conStock(p) && p.venc && diasPara(p.venc) < 0)
                    .sort((a,b) => diasPara(a.venc) - diasPara(b.venc))
  },
  d90: {
    titulo: "Vence dentro de 90 dias",
    nota: "Lo mas cerca de vencer, arriba. Todavia hay tiempo de devolver al proveedor o " +
          "sacarlo en promocion — despues ya no.",
    lista: () => cat.filter(p => { const d = diasPara(p.venc);
                                   return conStock(p) && d !== null && d >= 0 && d < 90; })
                    .sort((a,b) => diasPara(a.venc) - diasPara(b.venc))
  },
  cero: {
    titulo: "Sin stock — para planificar la compra",
    nota: "Ordenado por clase y por costo: arriba lo de clase A, que es donde esta tu dinero. " +
          "Que un producto este en cero no significa que haya que reponerlo: puede que lo " +
          "dejaras de vender a proposito.",
    lista: () => cat.filter(p => !conStock(p)).sort((a,b) => {
      const o = {A:0, B:1, C:2};
      const d = (o[a.abc] ?? 3) - (o[b.abc] ?? 3);
      return d || (b.costo || 0) - (a.costo || 0);
    })
  }
};

function abrirDetalle(que){ detalleQue = que; ir("detalle"); }

function vistaDetalle(){
  const v = $("#vista"); v.innerHTML = "";
  const d = DETALLES[detalleQue];
  if(!d) return ir("resumen");
  const l = d.lista();

  const volver = document.createElement("button");
  volver.className = "volver";
  volver.textContent = "‹ Volver al resumen";
  volver.onclick = () => ir("resumen");
  v.appendChild(volver);

  const val = l.reduce((s,p) => s + valor(p), 0);
  v.insertAdjacentHTML("beforeend",
    '<h2 class="sec">' + d.titulo + '</h2>' +
    '<div class="cabDet"><span class="tot"><b>' + l.length + '</b> producto(s)' +
    (val > 0 ? ' · ' + soles(val) + ' en estante' : '') + '</span></div>');

  if(!l.length){
    v.insertAdjacentHTML("beforeend", '<div class="nota">Nada aqui. Buena noticia.</div>');
    return;
  }

  l.forEach(p => {
    const dd = diasPara(p.venc);
    const tr = franja(dd);
    const fila = document.createElement("div");
    fila.className = "prod";
    fila.style.setProperty("--c", tr ? tr.c : "var(--linea)");
    /* Cada linea dice lo que hace falta para DECIDIR, que cambia segun la
       tarjeta: si es de vencimiento manda la fecha; si es de compra, el costo. */
    const der = detalleQue === "cero"
      ? '<b>' + soles(p.costo || 0) + '</b><span>costo unitario</span>'
      : '<b>' + soles(valor(p)) + '</b><span>' + (p.stock || 0) + ' u</span>';
    const sub = detalleQue === "cero"
      ? (p.visto ? "Contado el " + p.visto : "Nunca contado")
      : (dd === null ? "Sin fecha de vencimiento"
                     : (dd < 0 ? "Vencio hace " + Math.abs(dd) + " dias"
                               : "Vence en " + dd + " dias · " + (p.venc || "")));
    fila.innerHTML =
      '<div class="txt"><b><span class="pastilla abc' + (p.abc||"C") + '">' + (p.abc||"C") + '</span>' +
      p.nom + '</b><span>' + sub + (p.lote ? " · lote " + p.lote : "") +
      (p.marca ? " · " + p.marca : "") + '</span></div>' +
      '<div class="der">' + der + '</div>';
    v.appendChild(fila);
  });

  v.insertAdjacentHTML("beforeend", '<div class="nota">' + d.nota + '</div>');
