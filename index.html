<!DOCTYPE html>
<!--
  PROMEDIC · Inventario    v0.6  (partes 1 y 2 de 3)
  ============================================================
  Autor:  Ing. Ángel Ybarra Rivas
  Para:   PROMEDIC · Rodríguez de Mendoza, Amazonas, Perú
  Año:    2026
  Uso personal. Si alguien quiere usarla, que mantenga este crédito.
  ------------------------------------------------------------
  PARTE 1 — lo que ya funciona:
    · Carga el catálogo desde INVENTARIO_CATALOGO.csv (700 productos).
    · VENCIMIENTOS con semáforo: vencidos, 30, 90 y 180 días.
    · Buscador de productos.
    · Resumen: valorización y clasificación ABC.

  PARTE 2 — hecha:
    · Cola de conteo diaria: ~17 productos, elegidos por clase ABC y por
      cuánto hace que no se miran. A cada 30 días, B cada 90, C cada 180.
    · Al contar se guarda la DIFERENCIA contra lo que decía el sistema.
      Esa diferencia es la medida de las mermas — no se tapa, se mide.
    · Si al producto le falta la fecha de vencimiento, la pide justo ahí:
      es el único momento en que tienes la caja en la mano.

  v0.3 — el selector de archivos rechazaba el CSV.
  El input tenia accept=".csv,text/csv". Android no mira la extension sino
  el tipo MIME que le puso la app que descargo el archivo (WhatsApp y el
  chat lo entregan como application/octet-stream o text/plain), asi que el
  archivo salia DESACTIVADO en la lista: se tocaba y no pasaba nada.
  Quitado el filtro; ahora se valida por contenido. Se anadio aviso de
  lectura, control de error y una caja para pegar el CSV como alternativa.

  v0.4 — sin accept, Android abria el menu "elige una accion" con Camara y
  Grabadora, sin explorador de archivos. accept="*/*" es el punto medio:
  Chrome abre el explorador y no desactiva ningun archivo por su tipo.

  PARTE 3 (siguiente) — reposiciones desde las facturas, consumo aparente
  y rotacion real por producto.

  Por qué el catálogo se IMPORTA y no viene dentro del archivo:
  el inventario cambia. Si estuviera escrito aquí dentro, cada cambio
  obligaría a rehacer la app. Importándolo, tú actualizas el CSV y la
  app lo lee. Es el mismo principio que usamos con los movimientos.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="author" content="Ing. Ángel Ybarra Rivas">

<title>PROMEDIC · Inventario</title>
<style>
/* ---- 1) APARIENCIA ---------------------------------------------------
   Misma familia visual que la app de registro, pero con acento distinto
   (cian en vez de esmeralda) para que no confundas una con otra.      */
:root{
  --fondo:#0B1120; --sup:#141E33; --sup2:#1B2740; --linea:#26344D;
  --texto:#F1F5F9; --suave:#8FA3BF; --sombra:0 10px 30px rgba(0,0,0,.35);
  --acento:#06B6D4; --acento2:#22D3EE;
  --rojo:#F43F5E; --ambar:#F59E0B; --amarillo:#EAB308; --verde:#10B981;
}
html[data-tema="claro"]{
  --fondo:#F4F6FB; --sup:#FFFFFF; --sup2:#F8FAFC; --linea:#E4E9F2;
  --texto:#0B1120; --suave:#64748B; --sombra:0 8px 24px rgba(15,23,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 92px;background:var(--fondo);color:var(--texto);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:300px;z-index:0;
  background:radial-gradient(120% 100% at 50% -20%,var(--acento),transparent 70%);
  opacity:.18;pointer-events:none}
html[data-tema="claro"] body::before{opacity:.08}

header{position:sticky;top:0;z-index:6;backdrop-filter:blur(14px);
  background:var(--fondo);border-bottom:1px solid var(--linea);padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acento),var(--acento2));
  color:#04121C;font-weight:800;font-size:13px}
.marca h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.marca small{display:block;font-size:10.5px;color:var(--suave)}
.tema{background:var(--sup);border:1px solid var(--linea);color:var(--texto);
  width:36px;height:36px;border-radius:11px;font-size:15px;cursor:pointer;flex:none}

/* franja de estado: aparte del encabezado, para que nunca se solapen */
.estado{position:sticky;top:59px;z-index:5;background:var(--sup);
  border-bottom:1px solid var(--linea);padding:8px 18px;
  font-size:11.5px;color:var(--suave);text-align:center;line-height:1.5}
.estado b{color:var(--acento)}
.estado .mal{color:var(--rojo)}

main{position:relative;z-index:1;padding:18px;max-width:620px;margin:0 auto}

h2.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--suave);
  margin:22px 0 10px;font-weight:700}
h2.sec:first-child{margin-top:0}

/* tarjetas de resumen */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--sup);border:1px solid var(--linea);border-radius:16px;padding:14px}
.kpi small{display:block;font-size:10px;color:var(--suave);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px;font-weight:650}
.kpi b{font-size:20px;font-weight:750;letter-spacing:-.5px;display:block}
.kpi.alerta{border-color:var(--rojo)}
.kpi.alerta b{color:var(--rojo)}
.kpi.aviso{border-color:var(--ambar)}
.kpi.aviso b{color:var(--ambar)}

/* fila de producto */
.prod{background:var(--sup);border:1px solid var(--linea);border-left:3px solid var(--c,var(--linea));
  border-radius:13px;padding:11px 13px;margin-bottom:7px;display:flex;gap:10px;
  justify-content:space-between;align-items:center}
.prod .txt{min-width:0;font-size:13px;line-height:1.45}
.prod .txt b{display:block;font-size:13.5px;font-weight:620;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prod .txt span{color:var(--suave);font-size:11px}
.prod .der{text-align:right;white-space:nowrap;flex:none}
.prod .der b{font-size:14px;font-weight:750;display:block}
.prod .der span{font-size:10.5px;color:var(--suave)}
.pastilla{font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 5px;border-radius:5px;
  margin-right:5px;vertical-align:1px;display:inline-block}
.abcA{background:#F43F5E;color:#2B0410}
.abcB{background:#F59E0B;color:#2B1A04}
.abcC{background:#64748B;color:#0B1120}

.vacio{color:var(--suave);font-size:12.5px;padding:22px 14px;text-align:center;
  border:1px dashed var(--linea);border-radius:14px;line-height:1.6}
textarea{width:100%;padding:12px;border:1px solid var(--linea);border-radius:13px;
  font-size:13px;font-family:inherit;background:var(--sup);color:var(--texto);resize:vertical}
input[type=text],input[type=file],select{width:100%;padding:12px;border:1px solid var(--linea);
  border-radius:13px;font-size:15px;font-family:inherit;background:var(--sup);color:var(--texto)}
.btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:14.5px;font-weight:750;
  font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--acento),var(--acento2));
  color:#04121C;box-shadow:var(--sombra);margin-top:12px}
.btn.sec{background:var(--sup);color:var(--texto);border:1px solid var(--linea);box-shadow:none}
.nota{background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:14px;
  font-size:12.5px;line-height:1.6;color:var(--suave);margin-top:16px}
.nota b{color:var(--texto)}

/* venta rapida: SOLO clase A */
.vr{display:flex;gap:7px;margin-top:9px;align-items:center}
.vr input{flex:1 1 auto;min-width:0;padding:9px 6px;text-align:center;font-size:15px;
  font-weight:700;border:1px solid var(--linea);border-radius:10px;background:var(--sup2);
  color:var(--texto)}
.vr button{flex:0 0 74px;padding:9px 4px;border:none;border-radius:10px;font-family:inherit;
  font-size:12px;font-weight:750;cursor:pointer;background:var(--rojo);color:#2B0410}
.vr small{flex:0 0 auto;font-size:10.5px;color:var(--suave)}

/* conteo del dia */
.cnt{background:var(--sup);border:1px solid var(--linea);border-left:3px solid var(--c,var(--linea));
  border-radius:13px;padding:12px 13px;margin-bottom:8px}
.cnt .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cnt .cab b{font-size:13.5px;font-weight:620;line-height:1.35}
.cnt .cab .esp{font-size:11px;color:var(--suave);white-space:nowrap;text-align:right;flex:none}
.cnt .sub{color:var(--suave);font-size:11px;margin-top:3px}
.cnt .fila{display:flex;gap:8px;margin-top:10px;align-items:center}
.cnt .fila input{flex:1 1 auto;min-width:0;padding:11px 6px;text-align:center;font-size:17px;
  font-weight:700;border:1px solid var(--linea);border-radius:11px;background:var(--sup2);
  color:var(--texto)}
.cnt .fila button{flex:0 0 78px;padding:11px 4px;border:none;border-radius:11px;font-family:inherit;
  font-size:13px;font-weight:750;cursor:pointer;
  background:linear-gradient(135deg,var(--acento),var(--acento2));color:#04121C}
.cnt .fila button.sec{background:var(--sup2);color:var(--suave);border:1px solid var(--linea);
  flex:0 0 54px;font-size:11.5px}
.cnt .fecha{margin-top:8px}
.cnt .fecha input{width:100%;padding:10px;border:1px solid var(--ambar);border-radius:11px;
  background:var(--sup2);color:var(--texto);font-family:inherit;font-size:14px}
.cnt .fecha small{display:block;color:var(--ambar);font-size:11px;margin-bottom:5px;font-weight:650}
.cnt.ok{opacity:.5;border-left-color:var(--verde)}
.barra{height:7px;background:var(--sup2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),var(--acento2))}
.dif{font-weight:750}
.dif.mas{color:var(--verde)} .dif.menos{color:var(--rojo)}

/* barra inferior de secciones */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--fondo);
  border-top:1px solid var(--linea);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:6px;max-width:620px;margin:0 auto}
.nav button{flex:1;padding:10px 4px;border:none;background:none;color:var(--suave);
  font-family:inherit;font-size:10.5px;font-weight:650;cursor:pointer;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:17px}
.nav button.on{color:var(--acento);background:var(--sup)}
.nav button:disabled{opacity:.35}

footer{text-align:center;padding:24px 16px 6px;color:var(--suave);font-size:11px;line-height:1.8}
footer b{color:var(--texto);font-weight:650}
footer .v{display:inline-block;margin-top:6px;padding:3px 11px;border:1px solid var(--linea);
  border-radius:999px;font-size:10px;background:var(--sup)}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="logo">I</div>
    <div><h1>PROMEDIC</h1><small>Inventario</small></div>
  </div>
  <button class="tema" id="btnTema" title="Cambiar tema">☀️</button>
</header>

<div class="estado" id="estado">Sin catálogo cargado</div>

<main id="vista"></main>

<div class="nav">
  <button data-v="resumen" class="on"><span class="ic">📊</span>Resumen</button>
  <button data-v="contar"><span class="ic">✅</span>Contar</button>
  <button data-v="vencer"><span class="ic">⏳</span>Vencimientos</button>
  <button data-v="buscar"><span class="ic">🔍</span>Buscar</button>
  <button data-v="datos"><span class="ic">⚙️</span>Catálogo</button>
</div>

<script>
/* ---- 2) COMPORTAMIENTO ---------------------------------------------- */

const VERSION = "v0.6";

/* ---------- CATALOGO CIFRADO -----------------------------------------
   El catalogo viaja DENTRO de la app, pero cifrado con AES-256-GCM.
   Quien abra la URL y mire el codigo fuente solo ve un bloque de base64
   sin sentido: sin la clave no hay forma de leer costos ni stock.

   La clave de cifrado no esta aqui: se deriva de la frase que tu escribes,
   con PBKDF2-SHA256 y 250.000 iteraciones. Esas iteraciones son a proposito:
   hacen que probar claves al azar cueste tiempo de computo real.

   Se escribe UNA vez. Despues el catalogo queda descifrado en este telefono
   y la app abre directo.                                                */
async function descifrarCatalogo(frase){
  const b = JSON.parse(document.getElementById("cifrado").textContent);
  const bin = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(frase),
                                             "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:bin(b.s), iterations:b.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  /* AES-GCM verifica la integridad: si la frase esta mal, esto lanza error.
     No hace falta comprobar nada mas — el propio cifrado lo detecta. */
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:bin(b.iv)}, k, bin(b.d));
  return new TextDecoder("utf-8").decode(pt);
}
const $ = s => document.querySelector(s);
const num = n => (n || 0).toLocaleString("es-PE", {minimumFractionDigits:2, maximumFractionDigits:2});
const soles = n => "S/ " + num(n);

/* --- tema --- */
function aplicarTema(t){
  document.documentElement.dataset.tema = t;
  $("#btnTema").textContent = t === "oscuro" ? "☀️" : "🌙";
  try { localStorage.setItem("promedic_inv_tema", t); } catch(e){}
}
$("#btnTema").onclick = () =>
  aplicarTema(document.documentElement.dataset.tema === "oscuro" ? "claro" : "oscuro");

/* --- datos --- */
let cat = [];                 /* el catálogo completo */
try { cat = JSON.parse(localStorage.getItem("promedic_inv") || "[]"); } catch(e){ cat = []; }
function grabar(){
  try { localStorage.setItem("promedic_inv", JSON.stringify(cat)); return true; }
  catch(e){
    alert("No se pudo guardar el catálogo en este teléfono: " + e.message);
    return false;
  }
}

/* Días que faltan para una fecha "AAAA-MM-DD".
   Se compara a medianoche para que "hoy" sea 0 y no 0.4 de un día. */
function diasPara(iso){
  if(!iso) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const p = iso.split("-");
  return Math.round((new Date(+p[0], +p[1]-1, +p[2]) - hoy) / 86400000);
}

/* El semáforo. Los cortes no son caprichosos:
   <0    ya vencido        → retirar del estante, es sanitario
   <30   último mes        → liquidar ya
   <90   tres meses        → aún se puede devolver o promocionar
   <180  seis meses        → vigilar, no comprar más de eso        */
function franja(d){
  if(d === null) return null;
  if(d < 0)   return {k:"vencido", t:"VENCIDO",  c:"var(--rojo)"};
  if(d < 30)  return {k:"d30",     t:"< 30 días", c:"var(--rojo)"};
  if(d < 90)  return {k:"d90",     t:"< 90 días", c:"var(--ambar)"};
  if(d < 180) return {k:"d180",    t:"< 6 meses", c:"var(--amarillo)"};
  return null;
}
const valor = p => (p.costo || 0) * (p.stock || 0);

/* El stock NO es lo que hay ahora: es lo que habia el dia del conteo.
   Entre conteo y conteo se queda viejo, y eso es normal — la diferencia
   es justamente lo que vendiste. Por eso el numero SIEMPRE sale con su
   fecha: sin ella induce a error, y de hecho ya lo hizo. */
function textoStock(p){
  const s = "stock " + (p.stock || 0);
  if(!p.visto) return s + " · sin contar";
  const d = desdeConteo(p);
  if(d === 0) return s + " · contado hoy";
  if(d === 1) return s + " · contado ayer";
  return s + " · al " + fmtFecha(p.visto) + " (" + d + " d)";
}
const conStock = p => (p.stock || 0) > 0;

function pintarEstado(){
  const e = $("#estado");
  if(!cat.length){ e.innerHTML = "Sin catálogo cargado"; return; }
  const tot = cat.reduce((s,p) => s + valor(p), 0);
  const venc = cat.filter(p => conStock(p) && diasPara(p.venc) < 0 && p.venc).length;
  e.innerHTML = "<b>" + cat.length + "</b> productos · <b>" + soles(tot) + "</b>" +
    (venc ? ' · <b class="mal">' + venc + "</b> vencidos con stock" : "");
}

/* ---- vistas ---- */
function filaProd(p, extra){
  const d = diasPara(p.venc), f = franja(d);
  const div = document.createElement("div");
  div.className = "prod";
  if(f) div.style.setProperty("--c", f.c);
  const plazo = p.venc
    ? (d < 0 ? "venció hace " + (-d) + " d" : (d === 0 ? "vence HOY" : "vence en " + d + " d"))
    : "sin fecha";
  div.innerHTML =
    '<div class="txt"><b><span class="pastilla abc' + p.abc + '">' + p.abc + '</span>' +
      p.nom + '</b>' +
    '<span>' + p.cat + ' · ' + textoStock(p) + ' · ' + plazo +
      (p.aviso ? ' · ⚠ ' + p.aviso : '') + '</span></div>' +
    '<div class="der"><b>' + soles(valor(p)) + '</b><span>' +
      (extra || (fmtFecha(p.venc) || "—")) + '</span></div>';
  return div;
}

function vistaResumen(){
  const v = $("#vista"); v.innerHTML = "";
  if(!cat.length) return sinCatalogo(v);

  const tot = cat.reduce((s,p) => s + valor(p), 0);
  const vencidos = cat.filter(p => conStock(p) && p.venc && diasPara(p.venc) < 0);
  const d90 = cat.filter(p => { const d = diasPara(p.venc); return conStock(p) && d !== null && d >= 0 && d < 90; });
  const cero = cat.filter(p => !conStock(p));
  const vv = a => a.reduce((s,p) => s + valor(p), 0);

  v.innerHTML = '<h2 class="sec">Tu inventario hoy</h2>';
  const g = document.createElement("div"); g.className = "kpis";
  const kpi = (t, val, sub, cls) =>
    '<div class="kpi ' + (cls||"") + '"><small>' + t + '</small><b>' + val + '</b>' +
    '<span style="font-size:11px;color:var(--suave)">' + sub + '</span></div>';
  g.innerHTML =
    kpi("Valorizado", soles(tot), cat.length + " productos") +
    kpi("Ya vencido", soles(vv(vencidos)), vencidos.length + " con stock", vencidos.length ? "alerta" : "") +
    kpi("Vence en 90 días", soles(vv(d90)), d90.length + " productos", d90.length ? "aviso" : "") +
    kpi("Sin stock", cero.length, "productos en cero");
  v.appendChild(g);

  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Dónde está tu dinero (ABC)</h2>');
  ["A","B","C"].forEach(k => {
    const l = cat.filter(p => p.abc === k);
    const pct = tot ? (100 * vv(l) / tot) : 0;
    const d = document.createElement("div");
    d.className = "prod";
    d.style.setProperty("--c", k === "A" ? "var(--rojo)" : k === "B" ? "var(--ambar)" : "var(--suave)");
    d.innerHTML =

/* ---------- VENTA RAPIDA (solo clase A) -------------------------------
   El metodo no registra ventas: se deducen contando. Pero un Minoderm de
   S/95 no es un sachet de S/0.25 — ahi una sola venta ya mueve la aguja,
   y entre conteo y conteo el numero se aleja demasiado.

   Por eso esto existe SOLO para clase A, donde esta el 80% del dinero, y
   es OPCIONAL: si no lo usas, el siguiente conteo lo corrige igual. No se
   extiende a B ni a C a proposito — ahi el volumen de ventas es alto, el
   valor bajo, y acabarias tecleando todo el dia. Eso mata el sistema.

   Lo vendido NO se usa para calcular el consumo aparente (que sigue
   saliendo de conteo a conteo); solo mantiene el stock mas cerca de la
   realidad. Asi no hay doble conteo.                                   */
function ventaRapida(p, cant){
  const antes = p.stock || 0;
  p.stock = Math.max(0, antes - cant);
  p.ventas = p.ventas || [];
  p.ventas.push({f: hoyISO(), q: cant});
  if(p.ventas.length > 60) p.ventas = p.ventas.slice(-60);
  grabar(); pintarEstado();
  return antes - p.stock;      /* lo realmente descontado */
}

function controlVenta(p, alHacer){
  const box = document.createElement("div");
  box.className = "vr";
  box.innerHTML = '<small>Vendí</small>' +
    '<input type="number" inputmode="numeric" min="1" placeholder="cant.">' +
    '<button>Descontar</button>';
  const inp = box.querySelector("input");
  box.querySelector("button").onclick = () => {
    const c = parseFloat(inp.value);
    if(isNaN(c) || c <= 0) return alert("Escribe cuántas unidades vendiste.");
    if(c > (p.stock || 0) &&
       !confirm("Dice que solo quedan " + (p.stock || 0) + ". ¿Descontar igual y dejarlo en 0?"))
      return;
    const d = ventaRapida(p, c);
    inp.value = "";
    if(alHacer) alHacer(d);
  };
  inp.onkeydown = e => { if(e.key === "Enter") box.querySelector("button").click(); };
  return box;
}

/* ---------- PARTE 2: CONTEO CICLICO ----------------------------------
   El problema real no era falta de disciplina: contar 700 productos de
   una vez es imposible mientras atiendes. Aqui se cuentan ~17 al dia,
   elegidos por cuanto dinero representan y por cuanto hace que no se
   miran. En unas semanas el catalogo entero queda tocado, sin que
   ningun dia te cueste mas de diez minutos.                          */
const META_DIARIA = 17;
const CADA = {A:30, B:90, C:180};   /* dias entre conteos, por clase */

const hoyISO = () => new Date().toISOString().slice(0,10);

/* ---------- FECHAS ---------------------------------------------------
   Dentro se guardan como AAAA-MM-DD (asi se ordenan solas y no hay
   ambiguedad). A la vista, siempre dd/mm/aaaa. El <input type="date">
   del sistema se descarto a proposito: muestra el formato del IDIOMA
   DEL TELEFONO — a Angel le salia mm/dd/yyyy — y eso no se puede
   cambiar desde la pagina.                                           */
function fmtFecha(iso){
  if(!iso) return "";
  const p = String(iso).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
}
/* dd/mm/aaaa -> AAAA-MM-DD. null si no vale. Comprueba que la fecha
   EXISTA de verdad: 31/02 se rechaza, no se convierte en 03/03. */
function parseFecha(t){
  const m = String(t).trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if(!m) return null;
  let d = +m[1], mes = +m[2], a = +m[3];
  if(a < 100) a += 2000;
  if(mes < 1 || mes > 12 || d < 1 || d > 31) return null;
  const f = new Date(a, mes - 1, d);
  if(f.getFullYear() !== a || f.getMonth() !== mes - 1 || f.getDate() !== d) return null;
  const dos = x => String(x).padStart(2, "0");
  return a + "-" + dos(mes) + "-" + dos(d);
}

/* dias desde el ultimo conteo. null = nunca se conto */
function desdeConteo(p){
  if(!p.visto) return null;
  const h = new Date(); h.setHours(0,0,0,0);
  const q = p.visto.split("-");
  return Math.round((h - new Date(+q[0], +q[1]-1, +q[2])) / 86400000);
}
/* toca contarlo? nunca contado = si, siempre */
function toca(p){
  const d = desdeConteo(p);
  return d === null || d >= (CADA[p.abc] || 180);
}

/* La cola del dia.
   ORDEN: 1) la clase manda — A antes que B antes que C.
          2) dentro de la clase, lo nunca contado primero.
          3) despues lo mas atrasado.
          4) a igualdad, lo que mas dinero vale.

   El punto 1 no es un detalle. La primera version ordenaba solo por dias
   de atraso, y como la clase C se cuenta cada 180 dias, sus productos
   acumulaban mas atraso absoluto y se COLABAN delante de la clase A.
   Resultado: la cola se llenaba de productos que juntos valen S/1,189
   mientras los de S/18,868 esperaban. Justo al reves de para lo que
   existe el ABC. Lo cazo una prueba, no la lectura del codigo.

   En regimen normal todo cabe igual: A necesita ~13 conteos al dia,
   B ~2 y C ~1.3. Total ~17. Nadie se queda fuera; solo se ordena.   */
const RANGO = {A:0, B:1, C:2};
function colaHoy(){
  const pend = cat.filter(toca);
  pend.sort((a,b) => {
    const ra = RANGO[a.abc] !== undefined ? RANGO[a.abc] : 3;
    const rb = RANGO[b.abc] !== undefined ? RANGO[b.abc] : 3;
    if(ra !== rb) return ra - rb;
    const da = desdeConteo(a), db = desdeConteo(b);
    if((da === null) !== (db === null)) return da === null ? -1 : 1;
    if(da !== null && da !== db) return db - da;
    return valor(b) - valor(a);
  });
  return pend.slice(0, META_DIARIA);
}

function vistaContar(){
  const v = $("#vista"); v.innerHTML = "";
  if(!cat.length) return sinCatalogo(v);

  const hechos = cat.filter(p => p.visto === hoyISO());
  const cola = colaHoy();
  const atrasados = cat.filter(toca).length;

  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Conteo de hoy</h2>');
  const pct = Math.min(100, Math.round(100 * hechos.length / META_DIARIA));
  v.insertAdjacentHTML("beforeend",
    '<div class="kpi"><small>Llevas contados hoy</small><b>' + hechos.length + ' de ' +
    META_DIARIA + '</b><div class="barra"><i style="width:' + pct + '%"></i></div>' +
    '<span style="font-size:11px;color:var(--suave)">' +
    (atrasados ? atrasados + ' productos esperan turno' : 'Todo el catálogo al día') +
    '</span></div>');

  if(!cola.length){
    v.insertAdjacentHTML("beforeend",
      '<div class="nota" style="margin-top:14px"><b>No toca contar nada más.</b><br>' +
      'Todo el catálogo está dentro de su plazo: clase A cada 30 días, B cada 90, C cada 180. ' +
      'Vuelve mañana.</div>');
    return mostrarDiferencias(v);
  }

  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Cuenta estos ' + cola.length + '</h2>');
  cola.forEach(p => v.appendChild(filaConteo(p)));
  mostrarDiferencias(v);
}

function filaConteo(p){
  const d = desdeConteo(p);
  const div = document.createElement("div");
  div.className = "cnt";
  div.style.setProperty("--c", p.abc === "A" ? "var(--rojo)"
                             : p.abc === "B" ? "var(--ambar)" : "var(--suave)");
  const cuando = d === null ? "nunca contado" : "hace " + d + " días";
  const pideFecha = !p.venc;     /* el momento de anotarla es con la caja en la mano */

  div.innerHTML =
    '<div class="cab"><b><span class="pastilla abc' + p.abc + '">' + p.abc + '</span>' +
      p.nom + '</b>' +
    '<div class="esp">' + (p.visto ? "al " + fmtFecha(p.visto) : "sin contar") +
      '<br><b style="font-size:15px">' + (p.stock || 0) + '</b></div></div>' +
    '<div class="sub">' + p.cat + ' · ' + cuando + ' · ' + soles(valor(p)) + '</div>' +
    (pideFecha ? '<div class="fecha"><small>⚠ Sin fecha de vencimiento — anótala del envase</small>' +
      '<input type="text" class="fv" inputmode="numeric" placeholder="dd/mm/aaaa" ' +
      'autocomplete="off"></div>' : '') +
    '<div class="fila">' +
      '<input type="number" inputmode="numeric" class="qty" placeholder="¿cuántos?">' +
      '<button class="sec ig">Igual</button>' +
      '<button class="gu">Guardar</button>' +
    '</div>';

  const qty = div.querySelector(".qty");
  const guardar = () => {
    const val = parseFloat(qty.value);
    if(isNaN(val) || val < 0) return alert("Escribe cuántas unidades hay. Si no hay, escribe 0.");
    const fv = div.querySelector(".fv");
    let venc = null;
    if(fv && fv.value.trim()){
      venc = parseFecha(fv.value);
      if(!venc) return alert("La fecha no es válida.\n\nEscríbela como dd/mm/aaaa, " +
                             "por ejemplo 30/06/2028.");
    }
    registrarConteo(p, val, venc);
    div.classList.add("ok");
    div.querySelectorAll("input,button").forEach(x => x.disabled = true);
    const dif = val - (p.stockPrev !== undefined ? p.stockPrev : val);
    setTimeout(() => vistaContar(), 450);
  };
  div.querySelector(".gu").onclick = guardar;
  div.querySelector(".ig").onclick = () => { qty.value = p.stock || 0; guardar(); };
  qty.onkeydown = e => { if(e.key === "Enter") guardar(); };
  return div;
}

/* Guarda el conteo. La diferencia contra lo que decia el sistema NO se
   descarta: es la medida de tus mermas, y ese numero hoy no lo tienes.  */
function registrarConteo(p, contado, fechaVenc){
  const esperado = p.stock || 0;
  p.hist = p.hist || [];
  p.hist.push({f: hoyISO(), esp: esperado, con: contado});
  if(p.hist.length > 24) p.hist = p.hist.slice(-24);   /* no crecer sin limite */
  p.stockPrev = esperado;
  p.stock = contado;
  p.visto = hoyISO();
  if(fechaVenc) p.venc = fechaVenc;
  grabar();
  pintarEstado();
}

/* Lo contado hoy, con su diferencia en unidades y en soles. */
function mostrarDiferencias(v){
  const hechos = cat.filter(p => p.visto === hoyISO() && p.hist && p.hist.length);
  if(!hechos.length) return;
  v.insertAdjacentHTML("beforeend", '<h2 class="sec">Contados hoy · ' + hechos.length + '</h2>');
  let dif = 0;
  hechos.forEach(p => {
    const u = p.hist[p.hist.length - 1];
    const d = u.con - u.esp;
    dif += d * (p.costo || 0);
    const div = document.createElement("div");
    div.className = "prod";
    div.style.setProperty("--c", d === 0 ? "var(--verde)" : "var(--rojo)");
    div.innerHTML =
      '<div class="txt"><b>' + p.nom + '</b><span>había ' + u.esp +
        ' · contado ' + u.con + '</span></div>' +
      '<div class="der"><b class="dif ' + (d > 0 ? "mas" : d < 0 ? "menos" : "") + '">' +
        (d === 0 ? "exacto" : (d > 0 ? "+" : "") + d) + '</b>' +
        '<span>' + (d === 0 ? "" : soles(Math.abs(d * (p.costo || 0)))) + '</span></div>';
    v.appendChild(div);
  });
  if(dif !== 0){
    v.insertAdjacentHTML("beforeend",
      '<div class="nota"><b>Diferencia de hoy: ' + (dif > 0 ? "+" : "") + soles(dif) + '</b><br>' +
      (dif < 0
        ? 'Falta mercadería que el sistema creía tener. Puede ser merma, robo, o ventas ' +
          'que no se descontaron. No se corrige solo: se mide y se vigila.'
        : 'Hay más de lo que el sistema creía. Suele ser mercadería que entró sin registrarse.') +
      '</div>');
  }
}

/* Lector de CSV con comillas. No uso split(",") a secas porque los nombres
   de producto traen comas dentro ("LECHE 1L, X 2") y partirían la fila. */
function leerCSV(txt){
  txt = txt.replace(/^﻿/, "");
  const filas = []; let f = [], campo = "", dentro = false;
  for(let i = 0; i < txt.length; i++){
    const c = txt[i];
    if(dentro){
      if(c === '"' && txt[i+1] === '"'){ campo += '"'; i++; }
      else if(c === '"') dentro = false;
      else campo += c;
    } else if(c === '"') dentro = true;
    else if(c === ","){ f.push(campo); campo = ""; }
    else if(c === "\n"){ f.push(campo); filas.push(f); f = []; campo = ""; }
    else if(c !== "\r") campo += c;
  }
  if(campo !== "" || f.length){ f.push(campo); filas.push(f); }
  return filas.filter(x => x.length > 1);
}

function importar(txt){
  let filas;
  try { filas = leerCSV(txt); } catch(e){ return alert("No pude leer el archivo: " + e.message); }
  if(filas.length < 2) return alert("El archivo está vacío o no es un CSV.\n\nSe leyeron " + filas.length + " línea(s).");
  const cab = filas[0].map(x => x.trim());
  const ix = n => cab.indexOf(n);
  const need = ["Id","Producto","Categoria","Costo","Stock","Vencimiento","ABC"];
  const falta = need.filter(n => ix(n) < 0);
  if(falta.length) return alert("Al archivo le faltan columnas: " + falta.join(", ") + "\n\nCabecera encontrada:\n" + cab.join(" | "));

  const nuevo = [];
  for(let i = 1; i < filas.length; i++){
    const r = filas[i];
    if(!r[ix("Producto")]) continue;
    nuevo.push({
      id: r[ix("Id")], nom: r[ix("Producto")], cat: r[ix("Categoria")],
      costo: parseFloat(r[ix("Costo")]) || 0,
      stock: parseFloat(r[ix("Stock")]) || 0,
      venc: (r[ix("Vencimiento")] || "").trim(),
      abc: (r[ix("ABC")] || "C").trim(),
      aviso: ix("Aviso") >= 0 ? (r[ix("Aviso")] || "").trim() : ""
    });
  }
  if(!nuevo.length) return alert("No encontré productos en el archivo.");
  cat = nuevo;
  if(!grabar()) return;
  try { localStorage.setItem("promedic_inv_fecha", new Date().toISOString().slice(0,10)); } catch(e){}
  pintarEstado();
  alert("Catálogo cargado: " + cat.length + " productos.");
  ir("resumen");
}

/* ---- navegación ---- */
const VISTAS = {resumen:vistaResumen, contar:vistaContar, vencer:vistaVencer,
                buscar:vistaBuscar, datos:vistaDatos};
function ir(v){
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  VISTAS[v]();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => ir(b.dataset.v));

/* ---- arranque ---- */
try { aplicarTema(localStorage.getItem("promedic_inv_tema") || "oscuro"); }
catch(e){ aplicarTema("oscuro"); }
pintarEstado();
ir(cat.length ? "resumen" : "datos");
</script>
